<script>
/* ==========================================================================
   RIPPLE — feature assembly, render loop, safety control loop.
   ========================================================================== */


const SY = { onsetEnv: 0, cfluxEnv: 0, novEnv: 0, lastBeats: 0, lastBar: -1, t: 0 };
const MOT = { rose: 0, roseSeed: 1.3, roseCool: 0, bolt: 0, boltSeed: 7.1, boltCool: 0 };
const SAFE = { mean: 0.12, prev: 0.12, scale: 1, lastD: 0, zc: [], flashRate: 0, pix: new Uint8Array(4) };
const PERF = { last: 0, ms: 8, raw: 8, iv: 16, ivEma: 16, fps: 60, frames: 0, acc: 0, t: 0 };

/* Plan §11 — quality dials pulled in the specified order: renderScale first
   (largest, cheapest win), then particle count, then fractal octaves, then
   bloom taps. Asymmetric hysteresis: 30 frames down, 300 frames up, 2 s
   minimum dwell. One extra rule the plan does not have but a browser needs:
   a single catastrophic frame drops straight to the floor, because a software
   rasterizer will otherwise wedge the tab before the counter ever fills. */
const GOV = {
  auto: true, tier: 0, down: 0, up: 0, dwell: 0, panic: false, probe: null,
  tiers: [
    { scale: 0.75, part: 1.00, oct: 0,  taps: 0 },
    { scale: 0.60, part: 0.55, oct: -1, taps: 0 },
    { scale: 0.50, part: 0.28, oct: -1, taps: -1 },
    { scale: 0.40, part: 0.12, oct: -2, taps: -2 },
    { scale: 0.30, part: 0.00, oct: -3, taps: -3 },
    { scale: 0.22, part: 0.00, oct: -4, taps: -3 }
  ]
};
function govSet(tier) {
  tier = Math.max(0, Math.min(GOV.tiers.length - 1, tier));
  if (tier === GOV.tier) return;
  GOV.tier = tier; GOV.down = GOV.up = 0; GOV.dwell = 0;
  RENDER_SCALE = GOV.tiers[tier].scale;
  resize(true);
}
function govApply() {
  const t = GOV.tiers[GOV.tier];
  D.octaves = Math.max(2, D.octaves + t.oct);
  D.pCount *= t.part;
  D.bloomTaps = Math.max(0, D.bloomTaps + t.taps);
  if (GOV.panic) { D.pCount = 0; D.bloomTaps = 0; D.bloomGain *= 0.5; D.octaves = 2; }
}
/* GL draw calls are asynchronous, so wall-clock time around renderFrame()
   measures submission, not the GPU. The honest signal available in a browser
   is the rAF interval: if the GPU cannot keep up, the interval stretches. */
function govTick(dt) {
  if (!GOV.auto || PARITY.lock) return;
  GOV.dwell += dt;
  // Warm-up frames and backgrounded-tab gaps are not GPU slowness. Feeding
  // them to the controller drops quality permanently on the first frame.
  if (frameNo < 25 || PERF.iv > 400) return;
  const iv = PERF.iv;                        // ms between rAF callbacks
  if (iv > 220) { govSet(GOV.tiers.length - 1); GOV.panic = true; return; }
  if (iv > 60 && GOV.dwell > 0.25) { govSet(GOV.tier + 1); return; }
  if (iv < 20) GOV.panic = false;
  if (PERF.ivEma > 22) { GOV.down++; GOV.up = 0; }
  else if (PERF.ivEma < 17.4) { GOV.up++; GOV.down = 0; }
  else { GOV.down = GOV.up = 0; }
  if (GOV.down > 30 && GOV.dwell > 2) govSet(GOV.tier + 1);
  else if (GOV.up > 300 && GOV.dwell > 2) govSet(GOV.tier - 1);
}

/* Warm-up probe. One synchronous hero-shader draw into a tiny target with an
   explicit finish() gives a real per-pixel cost, so the harness opens at a
   quality tier the machine can actually hold instead of discovering it by
   stalling for several seconds on frame one. */
function probeGpu() {
  const PW = 128, PH = 72;
  target(RT.bloomFbo[0], PW, PH);
  gl.disable(gl.BLEND);
  const fp = use(FRACTALS.warp_fbm.prog);
  bindTex(1, palTex); ui(fp, 'uPalette', 1);
  u1(fp, 'uPalRot', 0); u1(fp, 'uChromaBlend', 0.3); u1(fp, 'uSpiral', 0.2);
  u1(fp, 'uSpiralSpin', 0); u1(fp, 'uPaint', 0.1);
  u1(fp, 'uWarp', 4); u1(fp, 'uScale', 2); u1(fp, 'uFlow', 0.1);
  u1(fp, 'uCells', 3); u1(fp, 'uRim', 1); u1(fp, 'uIrid', 0.6);
  u1(fp, 'uMask', 0); u1(fp, 'uOct', 5); u1(fp, 'uRimWidth', 2.4);
  tri(); gl.finish();                                  // discard: warm caches
  const t0 = performance.now();
  for (let i = 0; i < 3; i++) tri();
  gl.finish();
  const per = (performance.now() - t0) / (3 * PW * PH); // ms per pixel
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  // ~2.4 full-frame passes of comparable weight per rendered frame
  let pick = GOV.tiers.length - 1;
  for (let i = 0; i < GOV.tiers.length; i++) {
    const sc = GOV.tiers[i].scale;
    const est = per * (RT.w * sc) * (RT.h * sc) * 2.4;
    if (est < 9.0) { pick = i; break; }
  }
  GOV.probe = { perPixelUs: per * 1000, tier: pick };
  if (pick !== 0) govSet(pick);
  return GOV.probe;
}

let tSec = 0, frameNo = 0;
let palRotSmooth = 0, palRotPrev = 0, hueRate = 0, spiralSpin = 0;

/* --- synthetic driver ---------------------------------------------------- */

function synthField(f) {
  const s = SYN[f.key];
  let v = s.v;
  if (s.lfo.on) v += lfoValue(s.lfo, tSec) * s.lfo.depth * (f.max - f.min) * 0.5;
  return Math.min(f.max, Math.max(f.min, v));
}

function buildFeatureFrame(dt) {
  const aspect = RT.w / Math.max(RT.h, 1);

  if (TL.play && tlTick(dt)) {
    // Replay is authoritative for everything the DSP owns; the host still owns
    // time and resolution, exactly as the native player will.
    F[0] = tSec; F[1] = dt;
    F[48] = RT.w; F[49] = RT.h; F[50] = aspect; F[51] = RENDER_SCALE;
    F[52] = F[53] = F[54] = F[55] = 0;
    return;
  }

  if (A.mode === 'mic' || A.mode === 'file') {
    const r = analyzeAudio(dt, tSec);
    if (r) {
      F[4] = r.rms; F[5] = r.peak; F[6] = r.loud; F[7] = r.dyn;
      for (let i = 0; i < 8; i++) F[8 + i] = r.band[i];
      F[16] = r.flux; F[17] = r.onset;
      F[20] = synthField(FIELD_BY_KEY.bpm);          // APPROX — manual/LFO
      F[21] = synthField(FIELD_BY_KEY.bpmConf);      // APPROX
      F[23] = r.perc;                                // APPROX
      for (let i = 0; i < 12; i++) F[24 + i] = r.chroma[i];
      F[36] = r.keyHue; F[37] = r.keyConf; F[38] = r.cflux; F[39] = r.centroid;
      F[40] = r.width; F[41] = r.bal; F[42] = r.novelty;
      F[44] = synthField(FIELD_BY_KEY.intensity);
      F[45] = SYN.era.v; F[46] = SYN.songMode.v; F[47] = synthField(FIELD_BY_KEY.paletteMix);
      F[3] = A.mediaEl && A.mediaEl.duration ? (A.mediaEl.currentTime / A.mediaEl.duration) : 0;
      F[2] = A.mediaEl ? A.mediaEl.currentTime : tSec;
      advanceRhythm(dt, F[20], F[21], F[17]);
      F[18] = RH.phase; F[19] = (RH.bar + RH.phase) / 4; F[22] = RH.beats;
      F[43] = RH.sectionPhase;
    }
  } else {
    /* synthetic */
    for (let i = 0; i < FIELDS.length; i++) {
      const f = FIELDS[i];
      if (f.auto) continue;
      F[f.i] = synthField(f);
    }
    F[2] = tSec; F[3] = SYN.trackFrac.v;

    if (SYNTH.autoRhythm) {
      advanceRhythm(dt, F[20], F[21], SY.onsetEnv);
      SY.onsetEnv *= Math.exp(-dt / 0.150);
      if (RH.beats !== SY.lastBeats) {
        SY.lastBeats = RH.beats;
        SY.onsetEnv = 0.75 + 0.25 * F[23];
        if (RH.bar !== SY.lastBar) {
          SY.lastBar = RH.bar;
          // a chord change roughly every second bar — this is what makes the
          // rose bloom testable without any audio at all
          if (RH.bar === 0 && rngSynth() < 0.55) SY.cfluxEnv = 0.85 + 0.15 * rngSynth();
        }
      } else if (rngSynth() < dt * 3.2 * F[23]) {
        SY.onsetEnv = Math.max(SY.onsetEnv, 0.45 + 0.4 * rngSynth());
      }
      SY.cfluxEnv *= Math.exp(-dt / 0.45);
      SY.novEnv *= Math.exp(-dt / 1.6);
      if (rngSynth() < dt / 22) SY.novEnv = 0.9;
      F[17] = Math.max(F[17], SY.onsetEnv);
      F[38] = Math.max(F[38], SY.cfluxEnv);
      F[42] = Math.max(F[42], SY.novEnv);
      F[18] = RH.phase; F[19] = (RH.bar + RH.phase) / 4; F[22] = RH.beats;
      F[43] = RH.sectionPhase;
    } else {
      F[18] = SYN.beatPhase.v; F[19] = SYN.barPhase.v;
    }
  }

  F[0] = tSec; F[1] = dt;
  F[48] = RT.w; F[49] = RT.h; F[50] = aspect; F[51] = RENDER_SCALE;
  F[52] = F[53] = F[54] = F[55] = 0;
}

/* --- motif envelopes (host side, so the shaders stay stateless) ---------- */

function advanceMotifs(dt) {
  MOT.rose *= Math.exp(-dt / 1.15);
  MOT.roseCool -= dt;
  if (F[38] > D.roseThreshold && MOT.roseCool <= 0) {
    MOT.rose = 1; MOT.roseSeed = rngMotif() * 90; MOT.roseCool = 0.85;
  }
  MOT.bolt *= Math.exp(-dt / 0.155);
  MOT.boltCool -= dt;
  if (F[17] > 0.82 && F[23] > D.boltThreshold && MOT.boltCool <= 0) {
    MOT.bolt = 1; MOT.boltSeed = rngMotif() * 90; MOT.boltCool = 0.14;
  }
}

/* --- palette rotation, smoothed on the shortest circular path ----------- */

function advancePalette(dt) {
  const wantRaw = ST.live.palette.rotateByKey ? D.palRot : 0;
  let d = (wantRaw - palRotSmooth) % 1;
  if (d > 0.5) d -= 1; if (d < -0.5) d += 1;
  palRotSmooth += d * Math.min(1, dt * 1.6);
  palRotSmooth = ((palRotSmooth % 1) + 1) % 1;
  let hd = Math.abs(palRotSmooth - palRotPrev);
  if (hd > 0.5) hd = 1 - hd;
  hueRate = hd / Math.max(dt, 1e-4);
  palRotPrev = palRotSmooth;
  spiralSpin += dt * (F[20] / 60) * 0.25 * 0.18;
}

/* ========================================================================== */
/*  render                                                                    */
/* ========================================================================== */

function palUniforms(rec) {
  bindTex(1, palTex); ui(rec, 'uPalette', 1);
  u1(rec, 'uPalRot', palRotSmooth);
  u1(rec, 'uChromaBlend', D.chromaBlend);
  u1(rec, 'uSpiral', D.spiral);
  u1(rec, 'uSpiralSpin', spiralSpin);
  u1(rec, 'uPaint', D.paint);
}

function renderFrame() {
  const src = RT.cur, dst = 1 - RT.cur;

  /* ---- PASS A: warp the feedback buffer ------------------------------- */
  target(RT.pingFbo[dst], RT.pw, RT.ph);
  gl.disable(gl.BLEND);
  const w = use(P.warp);
  bindTex(0, RT.ping[src]); ui(w, 'uPrev', 0);
  u1(w, 'uDecay', D.decay); u1(w, 'uZoom', D.zoom); u1(w, 'uRotate', D.rotate);
  u1(w, 'uWarpAmount', D.warpAmount); u1(w, 'uWarpScale', D.warpScale);
  u1(w, 'uBassGain', D.bassGain); u1(w, 'uSymmetry', D.symmetry);
  u1(w, 'uOnsetDecay', D.onsetDecay); u1(w, 'uCenterPull', D.centerPull);
  tri();

  /* ---- PASS B: additive paint ----------------------------------------- */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);

  let famKey = D.fractal;
  if (!FRACTALS[famKey]) famKey = FRACTAL_STUBS[famKey] || 'warp_fbm';
  const fam = FRACTALS[famKey];
  const fp = use(fam.prog);
  palUniforms(fp);
  u1(fp, 'uWarp', D.warp); u1(fp, 'uScale', D.scale); u1(fp, 'uFlow', D.flow);
  u1(fp, 'uCells', D.cells); u1(fp, 'uRim', D.rim); u1(fp, 'uIrid', D.iridescence);
  u1(fp, 'uMask', D.mask); u1(fp, 'uOct', D.octaves); u1(fp, 'uRimWidth', D.rimWidth);
  u1(fp, 'uIter', D.iterations); u1(fp, 'uEscape', D.escapeRadius);
  u1(fp, 'uOrbitR', D.orbitRadius); u1(fp, 'uBeatMorph', D.beatMorph);
  u1(fp, 'uTrapGain', D.trapGain);
  u1(fp, 'uFold', D.fold); u1(fp, 'uLine', D.line);
  u1(fp, 'uZoomPeriod', D.zoomPeriod); u1(fp, 'uZoomDepth', D.zoomDepth);
  tri();

  if (MOT.rose > 0.004 && D.roseGain > 0.001) {
    const r = use(P.rose);
    palUniforms(r);
    u1(r, 'uGain', D.roseGain * D.motifOpacity * D.motifGain);
    u1(r, 'uPetals', D.rosePetals);
    u1(r, 'uBloom', MOT.rose);
    u1(r, 'uSeed', MOT.roseSeed);
    tri();
  }
  if (MOT.bolt > 0.005 && D.boltGain > 0.001) {
    const bo = use(P.bolt);
    palUniforms(bo);
    u1(bo, 'uGain', D.boltGain * D.motifOpacity * D.motifGain);
    u1(bo, 'uForkDepth', D.boltFork);
    u1(bo, 'uImpulse', MOT.bolt);
    u1(bo, 'uSeed', MOT.boltSeed);
    tri();
  }

  const pc = Math.min(PARTICLE_MAX, Math.round(D.pCount));
  if (pc > 64) {
    const pp = use(P.part);
    palUniforms(pp);
    u1(pp, 'uCurlScale', D.pCurl); u1(pp, 'uLifetime', D.pLife);
    u1(pp, 'uSize', D.pSize); u1(pp, 'uEmit', D.pEmit); u1(pp, 'uRise', D.pRise);
    gl.bindVertexArray(partVao);
    gl.drawArrays(gl.POINTS, 0, pc);
    gl.bindVertexArray(null);
  }
  gl.disable(gl.BLEND);

  /* ---- bloom: bright pass + separable blur at quarter res -------------- */
  target(RT.bloomFbo[0], RT.bw, RT.bh);
  const br = use(P.bright);
  bindTex(0, RT.ping[dst]); ui(br, 'uSrc', 0);
  u1(br, 'uThreshold', D.bloomThreshold); u1(br, 'uKnee', D.bloomKnee);
  tri();
  if (D.bloomTaps >= 1) {
    const bl = use(P.blur);
    u1(bl, 'uTaps', D.bloomTaps);
    target(RT.bloomFbo[1], RT.bw, RT.bh);
    bindTex(0, RT.bloom[0]); ui(bl, 'uSrc', 0);
    u2(bl, 'uDir', 1 / RT.bw, 0);
    tri();
    target(RT.bloomFbo[0], RT.bw, RT.bh);
    bindTex(0, RT.bloom[1]);
    u2(bl, 'uDir', 0, 1 / RT.bh);
    tri();
  }

  /* ---- PASS C: composite + safety ------------------------------------- */
  target(RT.finalFbo, RT.w, RT.h);
  const c = use(P.comp);
  bindTex(0, RT.ping[dst]); ui(c, 'uScene', 0);
  bindTex(1, RT.bloom[0]); ui(c, 'uBloom', 1);
  u1(c, 'uExposure', D.exposure); u1(c, 'uBloomGain', D.bloomGain);
  u1(c, 'uGrain', D.grain); u1(c, 'uVignette', D.vignette);
  u1(c, 'uSaturate', D.saturate);
  u1(c, 'uIdle', 1);
  // The harness has no idle states and no intensity hotkey; both are host-side
  // controls. Set explicitly rather than left unset: an unset float uniform is
  // 0, which would black the frame and read as a shader bug.
  u1(c, 'uIntensity', 1);
  u1(c, 'uSafetyScale', SAFE.scale);
  u1(c, 'uMaxBright', D.maxBright);
  u1(c, 'uHueRate', hueRate);
  tri();

  /* ---- present -------------------------------------------------------- */
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, RT.finalFbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  gl.blitFramebuffer(0, 0, RT.w, RT.h, 0, 0, RT.w, RT.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  RT.cur = dst;
}

/* --- safety control loop (§12) ------------------------------------------ */

function measureLuminance(dt) {
  gl.bindTexture(gl.TEXTURE_2D, RT.final);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.mipFbo);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, SAFE.pix);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  SAFE.prev = SAFE.mean;
  SAFE.mean = (0.2126 * SAFE.pix[0] + 0.7152 * SAFE.pix[1] + 0.0722 * SAFE.pix[2]) / 255;
  const d = SAFE.mean - SAFE.prev;

  // Full-field flash rate. A reversal only counts when the swing is large
  // enough to read as a flash — sign changes alone fire on any lively scene,
  // and a limiter that dims a merely busy image is a bug, not caution.
  const swing = Math.max(0.05, D.maxLumDelta * 0.8);
  if (Math.sign(d) !== Math.sign(SAFE.lastD) && Math.abs(d) > swing
      && Math.abs(SAFE.lastD) > swing) SAFE.zc.push(tSec);
  while (SAFE.zc.length && tSec - SAFE.zc[0] > 1.0) SAFE.zc.shift();
  SAFE.flashRate = SAFE.zc.length * 0.5;
  if (Math.abs(d) > swing * 0.5) SAFE.lastD = d;

  let want = 1;
  if (d > D.maxLumDelta)
    want = Math.max(0.20, (SAFE.prev + D.maxLumDelta) / Math.max(SAFE.mean, 1e-3));
  // Above 3 Hz, back off proportionally rather than slamming to a fixed floor.
  if (SAFE.flashRate > 3)
    want = Math.min(want, Math.max(0.45, 1 - 0.14 * (SAFE.flashRate - 3)));
  SAFE.scale = want < SAFE.scale ? want : Math.min(1, SAFE.scale + dt * 1.2);
}

/* ========================================================================== */
/*  HUD                                                                       */
/* ========================================================================== */

const NOTE_NAMES = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'C#', 'G#', 'D#', 'A#', 'F'];
const hudRows = {};
{
  const rows = [
    ['fam', 'FAMILY'], ['bpm', 'BPM'], ['key', 'KEY'], ['era', 'ERA'],
    ['decay', 'DECAY'], ['lim', 'LIMITER'], ['perf', 'FRAME']
  ];
  rows.forEach(([k, label]) => {
    const d = E('div');
    d.appendChild(E('span', 'k', label + ' '));
    const b = E('b', null, '--');
    d.appendChild(b);
    hudEl.appendChild(d);
    hudRows[k] = b;
  });
}

function updateReadouts(now) {
  PERF.frames++;
  PERF.acc += 1;
  if (now - PERF.t < 140) return;
  const el = (now - PERF.t) / 1000;
  PERF.fps = PERF.frames / el;
  PERF.t = now; PERF.frames = 0;

  document.getElementById('sFps').textContent = PERF.fps.toFixed(0);
  const msEl = document.getElementById('sMs');
  msEl.textContent = PERF.ivEma.toFixed(1);
  msEl.className = PERF.ivEma > 20 ? 'hot' : '';
  document.getElementById('sRes').textContent = RT.pw + '\u00d7' + RT.ph;
  document.getElementById('sFrac').textContent = D.fractal;
  if (govKv) govKv.textContent = 'T' + GOV.tier + (GOV.panic ? '!' : '') + '  \u00b7  \u00d7' + fmt(RENDER_SCALE, 2)
    + '  \u00b7  oct ' + D.octaves + '  \u00b7  ' + Math.round(D.pCount / 1000) + 'k';
  if (scaleSlider && Math.abs(+scaleSlider.value - RENDER_SCALE) > 0.001) {
    scaleSlider.value = RENDER_SCALE; scaleNum.textContent = fmt(RENDER_SCALE, 2);
  }

  for (let i = 0; i < 8; i++) bandMeters[i].style.height = (F[8 + i] * 100).toFixed(1) + '%';
  for (let i = 0; i < 12; i++) chromaMeters[i].style.height = (F[24 + i] * 100).toFixed(1) + '%';

  FIELDS.forEach(f => {
    const r = driverRows[f.key];
    if (!r) return;
    if (f.auto) r.num.textContent = fmt(F[f.i], f.i === 0 || f.i === 2 ? 1 : (f.raw ? 0 : 3));
    else if (A.mode !== 'synth' || TL.play) r.num.textContent = fmt(F[f.i], f.raw ? 1 : 2);
  });

  safeKv.mean.textContent = fmt(SAFE.mean, 3);
  safeKv.delta.textContent = fmt(SAFE.mean - SAFE.prev, 3);
  safeKv.scale.textContent = fmt(SAFE.scale, 3);
  safeKv.scale.className = SAFE.scale < 0.999 ? 'bad' : 'ok';
  safeKv.flash.textContent = fmt(SAFE.flashRate, 1);
  safeKv.flash.className = SAFE.flashRate > 3 ? 'bad' : '';
  safeKv.clamp.textContent = fmt(D.maxLumDelta, 3) + ' / ' + fmt(D.maxBright, 2);

  tlKv.frames.textContent = TL.frames.length + (TL.rec ? ' \u25cf' : '');
  tlBar.firstChild.style.width = (100 * Math.min(1, TL.frames.length / Math.max(1, TL.seconds * TL.rate))) + '%';
  if (!TL.rec && tlRecBtn.classList.contains('on')) tlRecBtn.classList.remove('on');
  if (tlStepBtn) tlStepBtn.classList.toggle('on', TL.step);
  if (tlKv.step) {
    tlKv.step.textContent = TL.step
      ? (TL.cur + 1) + ' / ' + (TL.data ? TL.data.frames.length : 0) + (TL.ended ? '  end' : '')
      : (TL.play ? 'interpolated' : 'off');
  }

  if (!hudEl.classList.contains('off')) {
    hudRows.fam.textContent = D.fractal;
    hudRows.bpm.textContent = F[20].toFixed(1) + '  ~' + (F[21] < 0.35 ? '  FREE' : '');
    hudRows.key.textContent = NOTE_NAMES[Math.round(F[36] * 12) % 12] + '  ~conf ' + fmt(F[37], 2);
    hudRows.era.textContent = Math.round(F[45]) + '  ' + (ST.live.name || '');
    hudRows.decay.textContent = fmt(D.decay, 4) + '   paint ' + fmt(D.paint, 3);
    hudRows.lim.textContent = fmt(SAFE.scale, 3) + '   lum ' + fmt(SAFE.mean, 3)
      + '   flash ' + fmt(SAFE.flashRate, 1) + 'Hz';
    hudRows.perf.textContent = PERF.ivEma.toFixed(1) + ' ms   ' + PERF.fps.toFixed(0) + ' fps   '
      + RT.pw + '\u00d7' + RT.ph + '  T' + GOV.tier + '  ' + (GLCAP.float ? 'RGBA16F' : 'RGBA8');
  }
  syncSourceUi();
}

/* ========================================================================== */
/*  resize + loop                                                             */
/* ========================================================================== */

const MAX_PIXELS = 1280 * 720;
function resize(force) {
  const st = document.getElementById('stage');
  let w, h;
  if (PARITY.lock) {
    // Parity runs rasterize a fixed grid. Stage size, device pixel ratio and
    // the pixel budget all have to stop mattering here, or the diff measures
    // the browser window rather than the shaders.
    w = PARITY.w; h = PARITY.h;
  } else {
    let dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    w = Math.max(64, Math.round(st.clientWidth * dpr));
    h = Math.max(64, Math.round(st.clientHeight * dpr));
    if (w * h > MAX_PIXELS) {
      const k = Math.sqrt(MAX_PIXELS / (w * h));
      w = Math.max(64, Math.round(w * k)); h = Math.max(64, Math.round(h * k));
    }
  }
  if (!force && w === RT.w && h === RT.h) return;
  cv.width = w; cv.height = h;
  allocTargets(w, h, RENDER_SCALE);
  RT.mipLevels = 1 + Math.floor(Math.log2(Math.max(w, h)));
  gl.bindTexture(gl.TEXTURE_2D, RT.final);
  gl.generateMipmap(gl.TEXTURE_2D);
  RT.mipFbo = mkFbo(RT.final, RT.mipLevels - 1);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
new ResizeObserver(() => resize(false)).observe(document.getElementById('stage'));

let tPrev = performance.now();
let rafSeen = false, fallbackTimer = null;

function loop(now) {
  if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; }
  rafSeen = true;
  tick(now);
  requestAnimationFrame(loop);
}

function tick(now) {
  // A batch dump drives the pipeline itself; letting rAF in as well would
  // interleave extra frames into the feedback chain and desynchronize the run.
  if (PARITY.busy) { tPrev = now; return; }

  PERF.iv = frameNo === 0 ? 16.7 : (now - tPrev);
  PERF.ivEma += (PERF.iv - PERF.ivEma) * 0.12;
  tPrev = now;

  // Step replay: one timeline row per rAF frame, and nothing downstream of
  // here reads the wall clock. Same code path the dump uses, so what you watch
  // on screen is what lands in the PNGs.
  if (TL.step && TL.play && TL.data) {
    const tS = performance.now();
    stepOnce();
    PERF.raw = performance.now() - tS;
    PERF.ms += (PERF.raw - PERF.ms) * 0.10;
    updateReadouts(now);
    return;
  }

  const dt = Math.min(0.05, Math.max(0.0004, PERF.iv / 1000));
  tSec += dt;
  frameNo++;

  buildFeatureFrame(dt);
  uploadFeatureFrame();

  resetDraw(ST.live);
  applyMapping(ST.live.mapping);
  govApply();
  advanceMotifs(dt);
  advancePalette(dt);

  const t0 = performance.now();
  renderFrame();
  if (frameNo % 3 === 0 && PERF.ivEma < 40) measureLuminance(dt * 3);
  PERF.raw = performance.now() - t0;
  PERF.ms += (PERF.raw - PERF.ms) * 0.10;
  govTick(dt);

  tlCapture(dt);
  updateReadouts(now);
}

/* ==========================================================================
   PARITY — deterministic step replay and batch frame dump.

   Phase 1's gate is "render the same scripted timeline in both hosts and diff
   the frames". That only means something if every host-side input to a frame
   is pinned: dt, elapsed time, drawing-buffer size, render scale, governor
   tier, feedback history and every RNG. tlStepBegin() pins all of them;
   stepOnce() advances exactly one frame without consulting the wall clock.
   src/Ripple/Render/StepRunner.cs is the mirror of this code — change one and
   you must change the other.
   ========================================================================== */

function clearFeedback() {
  gl.clearColor(0, 0, 0, 1);
  for (let i = 0; i < 2; i++) {
    target(RT.pingFbo[i], RT.pw, RT.ph); gl.clear(gl.COLOR_BUFFER_BIT);
    target(RT.bloomFbo[i], RT.bw, RT.bh); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  target(RT.finalFbo, RT.w, RT.h); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  RT.cur = 0;
  gl.bindTexture(gl.TEXTURE_2D, RT.final);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindTexture(gl.TEXTURE_2D, null);
}

/* Reset every piece of host-side state a rendered frame depends on. Miss one
   and the diff quietly starts measuring whatever the harness happened to be
   doing before the run began. */
function tlStepBegin() {
  if (!TL.data) throw new Error('no timeline loaded');
  TL.step = true; TL.play = true; TL.stepFrame = 0; TL.cur = -1; TL.ended = false;
  tSec = 0; frameNo = 0;
  rngMotif = mulberry32(RNG_MOTIF_SEED);
  MOT.rose = 0; MOT.bolt = 0; MOT.roseCool = 0; MOT.boltCool = 0;
  MOT.roseSeed = 1.3; MOT.boltSeed = 7.1;
  SAFE.mean = 0; SAFE.prev = 0; SAFE.scale = 1; SAFE.lastD = 0;
  SAFE.flashRate = 0; SAFE.zc.length = 0;
  palRotSmooth = 0; palRotPrev = 0; hueRate = 0; spiralSpin = 0;
  // D.palRot too. resetDraw() deliberately does NOT clear it — it accumulates
  // across frames and advancePalette() consumes it modulo 1 — which means a
  // parity run inherited however much rotation the page had piled up since
  // load, and in a DUMP ALL each preset inherited the previous one's. The
  // native host has always zeroed it in ResetForDeterministicRun(); this side
  // did not, so the palette started at a different angle and every colour in
  // the run was off. Found by tools/compare-trace.mjs: palRot was one of three
  // traced parameters that differed, and the only one differing at frame 0.
  D.palRot = 0;
  RH.phase = 0; RH.bar = 0; RH.beats = 0; RH.sectionPhase = 0;
  RH.onsetEnv = 0; RH.lastOnset = -9;
  SY.onsetEnv = 0; SY.cfluxEnv = 0; SY.novEnv = 0; SY.lastBeats = 0; SY.lastBar = -1;
  GOV.auto = false; GOV.panic = false; GOV.tier = 0; GOV.down = 0; GOV.up = 0; GOV.dwell = 0;
  RENDER_SCALE = PARITY.scale;
  PARITY.lock = true;
  resize(true);
  clearFeedback();
}

function parityStepEnd() {
  TL.step = false; TL.play = false; TL.stepFrame = 0; TL.cur = -1; TL.ended = false;
  PARITY.lock = false; GOV.auto = true;
  resize(true);
  tPrev = performance.now();
}

/* Exactly one deterministic frame. dt is 1/rate, time is index/rate, and the
   luminance loop runs off the step index rather than a counter that started
   whenever the page loaded. */
function stepOnce() {
  const rate = (TL.data && TL.data.rate) || 60;
  const dt = 1 / rate;
  tSec = TL.stepFrame / rate;     // TL.stepFrame is the row about to render
  frameNo++;

  // Mode A: nothing carries between frames. Clearing here rather than in
  // tlStepBegin() also re-pins RT.cur to 0, so the ping-pong parity cannot
  // drift between the hosts either. Mirrored in StepRunner.StepOnce().
  if (PARITY.noFeedback) clearFeedback();

  buildFeatureFrame(dt);          // tlTick() copies row TL.stepFrame verbatim
  uploadFeatureFrame();

  resetDraw(ST.live);
  applyMapping(ST.live.mapping);
  govApply();                     // tier 0 is the identity, but keep the call

  // Each exclusion is its own switch, driven from tests/parity-config.json via
  // the parity driver. Mode A sets all three.
  if (PARITY.noGrain) D.grain = 0;
  if (PARITY.noParticles) D.pCount = 0;
  advanceMotifs(dt);
  advancePalette(dt);

  renderFrame();
  if (TL.cur % 3 === 0) measureLuminance(dt * 3);
  return TL.cur;
}

/* --- frame capture: readPixels -> PNG ----------------------------------- */

const CAP = { w: 0, h: 0, buf: null, cv: null, ctx: null, img: null };
function captureFrame() {
  const w = RT.w, h = RT.h;
  if (CAP.w !== w || CAP.h !== h) {
    CAP.w = w; CAP.h = h;
    CAP.buf = new Uint8Array(w * h * 4);
    CAP.cv = document.createElement('canvas');
    CAP.cv.width = w; CAP.cv.height = h;
    CAP.ctx = CAP.cv.getContext('2d');
    CAP.img = CAP.ctx.createImageData(w, h);
  }
  // Read the composite target, not the canvas: no DPR scaling, no compositor
  // in the path, and it works whether or not the drawing buffer was preserved.
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.finalFbo);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, CAP.buf);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // GL reads bottom-up, PNG is top-down. Force alpha opaque so the 2D canvas
  // cannot un-premultiply and shift the colours on the way out.
  const d = CAP.img.data, row = w * 4;
  for (let y = 0; y < h; y++) d.set(CAP.buf.subarray((h - 1 - y) * row, (h - y) * row), y * row);
  for (let i = 3; i < d.length; i += 4) d[i] = 255;
  CAP.ctx.putImageData(CAP.img, 0, 0);
  return new Promise(res => CAP.cv.toBlob(res, 'image/png'));
}

/* --- sinks: a picked directory, or a store-mode zip ---------------------- */

const CRC_T = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/* PNG is already deflated; storing is faster and keeps this to ~40 lines with
   no dependency. Fixed timestamps so two zips of the same run compare equal. */
function zipStore(entries) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let off = 0;
  for (const e of entries) {
    const name = enc.encode(e.name);
    const crc = crc32(e.data), sz = e.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2821, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, e.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2821, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + sz;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, off, true);
  return new Blob(parts.concat(central, [new Uint8Array(eo.buffer)]), { type: 'application/zip' });
}

async function makeSink(rootName) {
  if (window.showDirectoryPicker) {
    const dh = await window.showDirectoryPicker({ mode: 'readwrite', id: 'ripple-parity' });
    const dirs = new Map();
    return {
      kind: 'directory',
      async put(path, blob) {
        const parts = path.split('/');
        let cur = dh;
        for (let i = 0; i < parts.length - 1; i++) {
          const key = parts.slice(0, i + 1).join('/');
          let d = dirs.get(key);
          if (!d) { d = await cur.getDirectoryHandle(parts[i], { create: true }); dirs.set(key, d); }
          cur = d;
        }
        const fh = await cur.getFileHandle(parts[parts.length - 1], { create: true });
        const w = await fh.createWritable();
        await w.write(blob); await w.close();
      },
      async finish() {}
    };
  }
  const entries = [];
  return {
    kind: 'zip',
    async put(path, blob) { entries.push({ name: path, data: new Uint8Array(await blob.arrayBuffer()) }); },
    async finish() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(zipStore(entries));
      a.download = rootName + '.zip';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    }
  };
}

function glRendererName() {
  const e = gl.getExtension('WEBGL_debug_renderer_info');
  try { return String(gl.getParameter(e ? e.UNMASKED_RENDERER_WEBGL : gl.RENDERER)); }
  catch (err) { return 'unknown'; }
}

/* Render the whole timeline in step mode and write every stride-th frame.
   Every frame is rendered — the feedback buffer is history, so skipping any
   would change all the ones after it. Only the writing is strided. */
async function parityDump(opts) {
  if (PARITY.busy) { toast('dump already running'); return; }
  if (!TL.data) { toast('load a timeline first'); return; }

  const stride = Math.max(1, Math.round(opts.stride || 1));
  PARITY.w = Math.max(64, Math.round(opts.w || PARITY.w));
  PARITY.h = Math.max(64, Math.round(opts.h || PARITY.h));
  PARITY.stride = stride;
  if (opts.noFeedback !== undefined) PARITY.noFeedback = !!opts.noFeedback;
  if (opts.noGrain !== undefined) PARITY.noGrain = !!opts.noGrain;
  if (opts.noParticles !== undefined) PARITY.noParticles = !!opts.noParticles;
  const n = TL.data.frames.length;
  const rate = TL.data.rate || 60;
  const list = opts.all ? LIBRARY.map((p, i) => i) : [ST.presetIdx];

  let sink;
  try { sink = await makeSink('ripple-parity-harness'); }
  catch (e) { toast('dump cancelled'); return; }

  const savedIdx = ST.presetIdx;
  PARITY.busy = true;
  let written = 0;
  try {
    for (let li = 0; li < list.length; li++) {
      ST.presetIdx = list[li];
      presetSel.value = String(ST.presetIdx);
      applyPreset();
      const id = ST.live.id || ('preset' + ST.presetIdx);
      tlStepBegin();
      for (let i = 0; i < n; i++) {
        stepOnce();
        if (i % stride === 0) {
          // frame_NNNNN.png, matching StepRunner.RunDump() exactly:
          // compare-ssim.mjs pairs files by name, so a naming difference
          // reads as a missing frame rather than as a mismatch.
          await sink.put(id + '/frame_' + String(i).padStart(5, '0') + '.png', await captureFrame());
          written++;
        }
        if ((i & 31) === 0) {
          if (tlKv.dump) tlKv.dump.textContent = id + '  ' + i + '/' + n + '  ' + written + ' png';
          await new Promise(r => setTimeout(r, 0));   // let the UI breathe
        }
      }
      await sink.put(id + '/manifest.json', new Blob([JSON.stringify({
        schemaVersion: 1, kind: 'ripple-parity-dump', host: 'harness',
        preset: id, presetName: ST.live.name || id, fractal: ST.live.fractal,
        width: PARITY.w, height: PARITY.h, renderScale: PARITY.scale,
        rate: rate, frames: n, stride: stride, mode: 'step',
        feedback: !PARITY.noFeedback,
        grain: !PARITY.noGrain,
        particles: !PARITY.noParticles,
        gateMode: PARITY.gateMode || (PARITY.noFeedback ? 'A' : 'B'),
        rngParticleSeed: RNG_PARTICLE_SEED, rngMotifSeed: RNG_MOTIF_SEED,
        colorBuffer: GLCAP.float ? 'RGBA16F' : 'RGBA8',
        gl: String(gl.getParameter(gl.VERSION)), renderer: glRendererName()
      }, null, 2)], { type: 'application/json' }));
    }
    await sink.finish();
    toast('dumped ' + written + ' frames to ' + sink.kind);
  } catch (e) {
    toast('dump failed: ' + (e.message || e));
    throw e;
  } finally {
    PARITY.busy = false;
    parityStepEnd();
    ST.presetIdx = savedIdx;
    presetSel.value = String(savedIdx);
    applyPreset();
    if (tlKv.dump) tlKv.dump.textContent = written + ' png written';
  }
}

/* --- automation surface ------------------------------------------------- */
/* tools/parity-harness.mjs drives this over the Chrome DevTools Protocol so the
   gate can run without a human clicking DUMP and picking a directory.

   Every entry is a thin wrapper over the same functions the panel buttons call.
   That is deliberate: if the driver reimplemented the dump, the thing we
   automate would stop being the thing a person tests by hand, and the two
   would drift without anything noticing. */
window.__ripple = {
  ready: true,

  glInfo: () => ({
    version: String(gl.getParameter(gl.VERSION)),
    renderer: glRendererName(),
    float: GLCAP.float,
    floatLinear: GLCAP.floatLinear,
    colorBuffer: GLCAP.float ? 'RGBA16F' : 'RGBA8'
  }),

  presets: () => LIBRARY.map((p, i) => ({
    index: i, id: p.id || ('preset' + i), name: p.name || '', fractal: p.fractal || ''
  })),

  /* Record a timeline off the synthetic driver with dt pinned to 1/rate and no
     wall clock in the path.

     Reproducible: the driver's RNG is reseeded here, so the same seed yields the
     same timeline on any machine. Pass a seed to draw a different one — which is
     how you go looking for a recording that fires a rare event, rather than
     recording for longer and hoping. */
  record(seconds, rate, seed) {
    useSynth();
    rngSynth = mulberry32((seed === undefined || seed === null) ? RNG_SYNTH_SEED : seed >>> 0);
    tSec = 0; frameNo = 0;
    RH.phase = 0; RH.bar = 0; RH.beats = 0; RH.sectionPhase = 0;
    RH.onsetEnv = 0; RH.lastOnset = -9;
    SY.onsetEnv = 0; SY.cfluxEnv = 0; SY.novEnv = 0; SY.lastBeats = 0; SY.lastBar = -1;
    tlStart(seconds, rate);
    const n = Math.round(seconds * rate), dt = 1 / rate;
    for (let i = 0; i < n; i++) {
      tSec = i * dt; frameNo++;
      buildFeatureFrame(dt);
      tlCapture(dt);
    }
    tlStop();
    const out = tlExport();
    out.seed = (seed === undefined || seed === null) ? RNG_SYNTH_SEED : seed >>> 0;
    out.generator = 'ripple-harness/0.1 synthetic seed ' + out.seed;
    return out;
  },

  load(json) { tlLoad(json); return TL.data.frames.length; },

  /* PARITY.busy is set before tlStepBegin() so tick() bows out: an rAF frame
     landing mid-run would push an extra frame through the feedback chain and
     desynchronize everything after it. */
  parityBegin(o) {
    o = o || {};
    if (!TL.data) throw new Error('no timeline loaded');
    if (o.w) PARITY.w = Math.max(64, Math.round(o.w));
    if (o.h) PARITY.h = Math.max(64, Math.round(o.h));
    if (o.stride) PARITY.stride = Math.max(1, Math.round(o.stride));
    PARITY.noFeedback = !!o.noFeedback;
    PARITY.noGrain = !!o.noGrain;
    PARITY.noParticles = !!o.noParticles;
    if (typeof o.presetIdx === 'number') {
      ST.presetIdx = o.presetIdx;
      if (presetSel) presetSel.value = String(o.presetIdx);
      applyPreset();
    }
    PARITY.busy = true;
    tlStepBegin();
    return { preset: ST.live.id, name: ST.live.name, fractal: ST.live.fractal,
             w: RT.w, h: RT.h, pw: RT.pw, ph: RT.ph, frames: TL.data.frames.length };
  },

  step(n) { let i = -1; for (let k = 0; k < (n || 1); k++) i = stepOnce(); return i; },

  /* The composite target as base64 PNG. Chunked so a 960x540 frame does not
     blow the argument limit on String.fromCharCode. */
  async capture() {
    const buf = new Uint8Array(await (await captureFrame()).arrayBuffer());
    let out = '';
    const CH = 0x8000;
    for (let i = 0; i < buf.length; i += CH)
      out += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
    return btoa(out);
  },

  manifest(o) {
    o = o || {};
    return {
      schemaVersion: 1, kind: 'ripple-parity-dump', host: 'harness',
      preset: ST.live.id, presetName: ST.live.name || ST.live.id, fractal: ST.live.fractal,
      width: PARITY.w, height: PARITY.h, renderScale: PARITY.scale,
      rate: (TL.data && TL.data.rate) || 60,
      frames: (TL.data && TL.data.frames.length) || 0,
      stride: PARITY.stride, mode: 'step',
      feedback: !PARITY.noFeedback,
      grain: !PARITY.noGrain,
      particles: !PARITY.noParticles,
      gateMode: PARITY.gateMode || (PARITY.noFeedback ? 'A' : 'B'),
      rngParticleSeed: RNG_PARTICLE_SEED, rngMotifSeed: RNG_MOTIF_SEED,
      colorBuffer: GLCAP.float ? 'RGBA16F' : 'RGBA8',
      gl: String(gl.getParameter(gl.VERSION)), renderer: glRendererName(),
      timeline: o.timeline || ''
    };
  },

  /* The scalars a frame's appearance depends on, in the SAME ORDER as
     StepRunner.TraceKeys. tools/compare-trace.mjs diffs the two and names the
     parameter that diverged, which is the difference between "the images
     differ by 0.03 SSIM" and "decay is wrong". */
  traceKeys: () => [
    'decay', 'zoom', 'rotate', 'warpAmount', 'warpScale', 'bassGain', 'symmetry',
    'paint', 'centerPull', 'onsetDecay',
    'iterations', 'escapeRadius', 'orbitRadius', 'beatMorph',
    'warp', 'scale', 'flow', 'cells', 'rim', 'iridescence', 'mask', 'octaves', 'rimWidth',
    'trapGain', 'zoomPeriod', 'zoomDepth', 'fold', 'line',
    'boltGain', 'boltThreshold', 'roseGain', 'roseThreshold',
    'motifOpacity', 'motifGain',
    'pCount', 'pCurl', 'pLife', 'pSize', 'pEmit', 'pRise',
    'bloomThreshold', 'bloomGain', 'bloomTaps', 'bloomKnee',
    'grain', 'vignette', 'exposure', 'saturate',
    'chromaBlend', 'spiral', 'palRot',
    'maxLumDelta', 'maxBright',
    'rose', 'bolt', 'safeMean', 'safeScale', 'hueRate'
  ],

  trace: () => [
    D.decay, D.zoom, D.rotate, D.warpAmount, D.warpScale, D.bassGain, D.symmetry,
    D.paint, D.centerPull, D.onsetDecay,
    D.iterations, D.escapeRadius, D.orbitRadius, D.beatMorph,
    D.warp, D.scale, D.flow, D.cells, D.rim, D.iridescence, D.mask, D.octaves, D.rimWidth,
    D.trapGain, D.zoomPeriod, D.zoomDepth, D.fold, D.line,
    D.boltGain, D.boltThreshold, D.roseGain, D.roseThreshold,
    D.motifOpacity, D.motifGain,
    D.pCount, D.pCurl, D.pLife, D.pSize, D.pEmit, D.pRise,
    D.bloomThreshold, D.bloomGain, D.bloomTaps, D.bloomKnee,
    D.grain, D.vignette, D.exposure, D.saturate,
    D.chromaBlend, D.spiral, D.palRot,
    D.maxLumDelta, D.maxBright,
    MOT.rose, MOT.bolt, SAFE.mean, SAFE.scale, hueRate
  ],

  parityEnd() { PARITY.busy = false; parityStepEnd(); }
};

/* --- keyboard ----------------------------------------------------------- */
window.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'tab') { e.preventDefault(); panel.classList.toggle('collapsed'); resize(true); }
  else if (k === 'd') { document.getElementById('hudToggle').click(); }
  else if (k === '[') { SYN.intensity.v = Math.max(0, SYN.intensity.v - 0.05); refreshDriver(); toast('intensity ' + fmt(SYN.intensity.v)); }
  else if (k === ']') { SYN.intensity.v = Math.min(1, SYN.intensity.v + 0.05); refreshDriver(); toast('intensity ' + fmt(SYN.intensity.v)); }
  else if (k === 'arrowright') { ST.presetIdx = (ST.presetIdx + 1) % LIBRARY.length; presetSel.value = String(ST.presetIdx); applyPreset(); }
  else if (k === 'arrowleft') { ST.presetIdx = (ST.presetIdx + LIBRARY.length - 1) % LIBRARY.length; presetSel.value = String(ST.presetIdx); applyPreset(); }
  else if (k === 'r') { tlRecBtn.click(); }
  else if (k === 'm') { useMic(); }
});

/* --- go ----------------------------------------------------------------- */
if (document.documentElement.clientWidth < 780) panel.classList.add('collapsed');
resize(true);
applyPreset();
probeGpu();
syncSourceUi();
requestAnimationFrame(loop);

/* Embedded preview panes report document.hidden and suspend requestAnimationFrame.
   Plan §11 says an occluded window should stop rendering entirely, and that is
   the right behaviour for the shipped app — but in a preview the harness would
   just be a black rectangle. Fall back to a timer at a reduced rate, and hand
   control straight back to rAF the moment it wakes up. */
setTimeout(() => {
  if (!rafSeen && !fallbackTimer) fallbackTimer = setInterval(() => tick(performance.now()), 33);
}, 700);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) requestAnimationFrame(loop);
});
</script>
