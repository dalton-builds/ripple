<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIPPLE · visual harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060a; --panel:#080b0f; --panel2:#0b0f14; --line:#161c23; --line2:#222a33;
  --txt:#c2c9d1; --dim:#8b959f; --dimmer:#78828c;
  --acc:#e8b34a; --acc2:#4ec9a5; --live:#ff3d5e; --warn:#ff8a3d;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --rowh:17px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:var(--mono);font-size:11px;line-height:1.35;color:var(--txt);
  -webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:1fr auto;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--acc);color:#000}

/* ---------- stage ---------- */
#stage{position:relative;overflow:hidden;background:#000}
#gl{display:block;width:100%;height:100%}
#glerr{position:absolute;inset:0;display:none;place-content:center;padding:40px;
  color:var(--live);white-space:pre-wrap;font-size:12px;overflow:auto;background:#04060a}

/* diagnostic HUD (Ctrl+Alt+D / D) */
#hud{position:absolute;left:14px;bottom:12px;pointer-events:none;
  font-size:10px;letter-spacing:.06em;color:#dfe5ea;text-shadow:0 1px 3px rgba(0,0,0,.9);
  display:grid;gap:1px}
#hud.off{display:none}
#hud .k{color:#8d979f}
#hud b{font-weight:500;color:var(--acc)}
#cap{position:absolute;left:14px;bottom:12px;pointer-events:none;font-size:13px;
  letter-spacing:.04em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.95);opacity:0;transition:opacity .5s}
#cap.on{opacity:1}
#toast{position:absolute;top:12px;left:14px;font-size:10px;letter-spacing:.08em;
  color:#04060a;background:var(--acc);padding:3px 7px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#sigil{position:absolute;top:12px;right:14px;font-size:9px;letter-spacing:.22em;
  color:rgba(255,255,255,.28);pointer-events:none}

/* ---------- panel ---------- */
#panel{width:382px;background:var(--panel);border-left:1px solid var(--line2);
  display:flex;flex-direction:column;height:100vh;transition:width .18s ease}
#panel.collapsed{width:30px}
#panel.collapsed>*:not(#rail){display:none}
#rail{display:none}
#panel.collapsed #rail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0;height:100%}
#rail .vt{writing-mode:vertical-rl;font-size:9px;letter-spacing:.3em;color:var(--dim)}

/* header */
#phead{border-bottom:1px solid var(--line2);background:var(--panel2);flex:none}
#phead .r1{display:flex;align-items:center;gap:8px;padding:7px 9px 6px}
#phead .mark{font-size:11px;font-weight:600;letter-spacing:.26em;color:var(--txt)}
#phead .sub{font-size:9px;letter-spacing:.16em;color:var(--dimmer)}
#phead .r2{display:flex;gap:0;border-top:1px solid var(--line)}
#phead .stat{flex:1;padding:4px 8px;border-right:1px solid var(--line);min-width:0}
#phead .stat:last-child{border-right:0}
#phead .stat i{display:block;font-style:normal;font-size:8px;letter-spacing:.14em;color:var(--dimmer)}
#phead .stat b{font-weight:500;font-variant-numeric:tabular-nums;font-size:11px;color:var(--txt)}
#phead .stat b.hot{color:var(--warn)}

.xbtn{background:transparent;border:1px solid var(--line2);color:var(--dim);
  padding:2px 6px;font-size:9px;letter-spacing:.12em;cursor:pointer}
.xbtn:hover{border-color:var(--dim);color:var(--txt)}
.xbtn.on{border-color:var(--acc);color:var(--acc)}

/* body */
#pbody{overflow-y:auto;overflow-x:hidden;flex:1;scrollbar-width:thin;
  scrollbar-color:var(--line2) transparent}
#pbody::-webkit-scrollbar{width:9px}
#pbody::-webkit-scrollbar-thumb{background:var(--line2)}
#pbody::-webkit-scrollbar-track{background:transparent}

.sec{border-bottom:1px solid var(--line)}
.sec>h3{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  padding:5px 9px;font-size:9px;font-weight:500;letter-spacing:.2em;color:var(--dim);
  background:var(--panel2);border-bottom:1px solid transparent}
.sec>h3:hover{color:var(--txt)}
.sec>h3 .cv{color:var(--dimmer);font-size:8px;width:6px}
.sec>h3 .tag{margin-left:auto;font-size:8px;letter-spacing:.1em;color:var(--dimmer)}
.sec.open>h3{border-bottom-color:var(--line);color:var(--txt)}
.sec .body{display:none;padding:5px 9px 8px}
.sec.open .body{display:block}

/* control rows */
.row{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;
  gap:6px;height:var(--rowh);margin-bottom:2px}
.row>label{font-size:9px;letter-spacing:.07em;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row>label.ap::after{content:'~';color:var(--warn);margin-left:3px}
.row .num{font-size:10px;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt)}
.row.wide{grid-template-columns:96px 1fr}
.row.f3{grid-template-columns:96px 1fr 40px 16px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--rowh);
  background:transparent;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:11px;
  background:var(--txt);margin-top:-5px;border-radius:0}
input[type=range]:hover::-webkit-slider-thumb{background:var(--acc)}
input[type=range]::-moz-range-track{height:1px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:3px;height:11px;background:var(--txt);border:0;border-radius:0}
input[type=range].lfo::-webkit-slider-thumb{background:var(--acc2)}

select,input[type=text],input[type=number]{background:#030508;
  border:1px solid var(--line2);padding:1px 4px;height:var(--rowh);width:100%;
  border-radius:0;outline:none;font-size:10px}
select:focus,input[type=text]:focus,input[type=number]:focus{border-color:var(--acc)}
select{-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 9px) 7px,calc(100% - 6px) 7px;
  background-size:3px 3px,3px 3px;background-repeat:no-repeat;padding-right:16px}
input[type=color]{-webkit-appearance:none;appearance:none;border:1px solid var(--line2);
  width:100%;height:var(--rowh);padding:0;background:transparent;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
input[type=color]::-webkit-color-swatch{border:0}

.lfobtn{width:16px;height:13px;border:1px solid var(--line2);background:transparent;
  color:var(--dimmer);font-size:8px;line-height:1;cursor:pointer;padding:0;display:grid;place-items:center}
.lfobtn:hover{border-color:var(--dim)}
.lfobtn.on{border-color:var(--acc2);color:var(--acc2)}
.lfopanel{display:none;grid-template-columns:1fr 1fr 1fr;gap:4px;
  margin:1px 0 4px 0;padding:4px 5px;background:#03050a;border-left:1px solid var(--acc2)}
.lfopanel.on{display:grid}
.lfopanel .cell i{display:block;font-style:normal;font-size:8px;letter-spacing:.1em;color:var(--dimmer)}

.btnrow{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0 1px}
.hint{font-size:9px;color:var(--dimmer);letter-spacing:.03em;margin:4px 0 2px;line-height:1.45}
.hint b{color:var(--dim);font-weight:400}
.divider{height:1px;background:var(--line);margin:7px -9px 6px}
.glabel{font-size:8px;letter-spacing:.2em;color:var(--dimmer);margin:7px 0 3px;
  display:flex;align-items:center;gap:5px}
.glabel::after{content:'';flex:1;height:1px;background:var(--line)}

/* meters */
.meters{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:4px 0 2px}
.meters .m{height:34px;background:#03050a;position:relative;overflow:hidden}
.meters .m span{position:absolute;left:0;right:0;bottom:0;background:var(--acc2)}
.meters .lbl{font-size:8px;letter-spacing:.02em;color:var(--dimmer);text-align:center;overflow:hidden}
.chgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:1px}
.chgrid .m{height:24px;background:#03050a;position:relative;overflow:hidden}
.chgrid .m span{position:absolute;left:0;right:0;bottom:0;background:var(--acc)}
.chgrid .lbl{font-size:8px;color:var(--dimmer);text-align:center}
.led{display:inline-block;width:5px;height:5px;background:var(--line2);vertical-align:middle}
.led.on{background:var(--live)}

.kv{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:9px;
  color:var(--dim);height:14px;align-items:center}
.kv b{font-weight:500;color:var(--txt);font-variant-numeric:tabular-nums}
.kv b.bad{color:var(--live)}
.kv b.ok{color:var(--acc2)}

textarea{width:100%;height:88px;background:#030508;border:1px solid var(--line2);
  font-size:9px;line-height:1.4;padding:4px;resize:vertical;outline:none;color:var(--dim)}
textarea:focus{border-color:var(--acc)}
.bar{height:2px;background:var(--line2);margin:4px 0}
.bar>span{display:block;height:100%;background:var(--live);width:0}
a{color:var(--acc);text-decoration:none}
a:hover{color:var(--txt);text-decoration:underline}
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="glerr"></div>
  <div id="sigil">RIPPLE / PHASE 0</div>
  <div id="cap"></div>
  <div id="hud" class="off"></div>
  <div id="toast"></div>
</div>

<aside id="panel">
  <div id="rail">
    <button class="xbtn" id="railToggle" title="expand panel">&#9666;</button>
    <div class="vt">RIPPLE HARNESS</div>
  </div>

  <div id="phead">
    <div class="r1">
      <span class="mark">RIPPLE</span>
      <span class="sub">HARNESS 0.1</span>
      <span style="flex:1"></span>
      <button class="xbtn" id="hudToggle" title="diagnostic HUD (D)">HUD</button>
      <button class="xbtn" id="collapse" title="collapse panel (Tab)">&#9656;</button>
    </div>
    <div class="r2">
      <div class="stat"><i>FPS</i><b id="sFps">--</b></div>
      <div class="stat"><i>FRAME</i><b id="sMs">--</b></div>
      <div class="stat"><i>BUFFER</i><b id="sRes">--</b></div>
      <div class="stat"><i>FRACTAL</i><b id="sFrac">--</b></div>
      <div class="stat"><i>SRC</i><b id="sSrc">SYNTH</b></div>
    </div>
  </div>

  <div id="pbody"></div>
</aside>

<script>
/* ==========================================================================
   RIPPLE — shader source.

   CONTRACTS.md §3: every shader lives in its own template literal fenced with
   a `// ===== FILE: <path> =====` marker. `tools/extract-shaders.mjs` splits
   this block into the shaders/ tree with no judgment calls.

   CONTRACTS.md §2: NO `#version` line in any file. The loader injects
   `#version 300 es` + precision qualifiers + `#define RIPPLE_WEBGL 1`.
   `#include "common/x.glsl"` is resolved by flat textual substitution with
   cycle detection — the same resolver the native host must implement.
   ========================================================================== */

// ===== FILE: shaders/common/features.glsl =====
const SH_FEATURES = `
// ============================================================================
//  Ripple — Feature Frame
//  FROZEN CONTRACT. schemaVersion 1.
// ============================================================================
//  This file is shared VERBATIM between the WebGL2 harness and the native
//  OpenGL host. Do not fork it. Do not add a #version line — each host
//  injects its own preamble at load time (see ShaderLoader / harness loader).
//
//  Every member is vec4-aligned DELIBERATELY. std140 pads float[] and vec3 to
//  a 16-byte stride, which is the single most common cause of silent uniform
//  buffer corruption. Packing everything as vec4 eliminates that entire class
//  of bug. Total size: 224 bytes (14 vec4). Assert this on the C# side.
//
//  All fields are normalized 0..1 EXCEPT where marked RAW.
//  Normalization lives in the DSP, never in the shader — that is what makes
//  presets portable and lets the synthetic driver produce valid states.
// ----------------------------------------------------------------------------
//  ONE sanctioned divergence, per CONTRACTS.md §2. GLSL ES 3.00 (WebGL2) does
//  not accept the \`binding\` layout qualifier on a uniform block — it arrives
//  in ES 3.10 / desktop GL 4.2. The harness therefore declares the block
//  without it and calls glUniformBlockBinding(prog, idx, 0) at link time,
//  which is bit-identical in effect. Guarded rather than forked so the file
//  stays byte-identical across hosts.
// ============================================================================

#ifdef RIPPLE_WEBGL
layout(std140) uniform FeatureFrame {
#else
layout(std140, binding = 0) uniform FeatureFrame {
#endif
    vec4 uTime;      // x: seconds since start        y: dt (seconds)
                     // z: track position (seconds)   w: track fraction (0 if unknown)

    vec4 uLevel;     // x: rms                        y: peak
                     // z: slow loudness (3s EMA)     w: dynamics (peak - rms)

    vec4 uBands[2];  // 8 perceptual bands, adaptively normalized (see plan 7.1)
                     // [0].x sub 20-60      [0].y bass 60-150
                     // [0].z lowMid 150-400 [0].w mid 400-1k
                     // [1].x hiMid 1k-2.4k  [1].y presence 2.4k-5k
                     // [1].z brilliance 5k-10k [1].w air 10k-16k

    vec4 uRhythm;    // x: spectral flux              y: onset impulse (~150ms decay)
                     // z: beat phase 0..1            w: bar phase 0..1 (4 beats)

    vec4 uTempo;     // x: BPM 40..200 (RAW)          y: BPM confidence
                     // z: beat counter (RAW, monotonic)  w: percussivity

    vec4 uChroma[3]; // 12 pitch-class energies, C at [0].x, normalized to max=1
                     // [0] = C  C# D  D#   [1] = E  F  F# G   [2] = G# A  A# B

    vec4 uTonal;     // x: key hue 0..1 (circle of fifths)  y: key confidence
                     // z: chroma flux (chord change)       w: spectral centroid

    vec4 uSpace;     // x: stereo width               y: stereo balance -1..1 (RAW)
                     // z: novelty (structural change) w: section phase

    vec4 uCtl;       // x: master intensity           y: era id 0..7 (RAW)
                     // z: song mode (RAW)            w: palette crossfade 0..1

    vec4 uRes;       // x: width px (RAW)             y: height px (RAW)
                     // z: aspect (RAW)               w: render scale

    vec4 uReserved;  // Reserved for schemaVersion 2+. MUST be zero-filled by
                     // both hosts. Exists so new fields can be added without
                     // repacking or changing the buffer size — append here,
                     // never reorder the blocks above.
};

// Size check: 13 declared vec4 above (uBands=2, uChroma=3) + uReserved = 14.
// 14 * 16 = 224 bytes. Both hosts assert this.

// ---------------------------------------------------------------------------
//  Named accessors. USE THESE, not the raw swizzles — they are the stable API.
//  If the packing ever has to change, only this block changes.
// ---------------------------------------------------------------------------

#define F_TIME          uTime.x
#define F_DT            uTime.y
#define F_TRACK_POS     uTime.z
#define F_TRACK_FRAC    uTime.w

#define F_RMS           uLevel.x
#define F_PEAK          uLevel.y
#define F_LOUD_SLOW     uLevel.z
#define F_DYNAMICS      uLevel.w

#define F_SUB           uBands[0].x
#define F_BASS          uBands[0].y
#define F_LOWMID        uBands[0].z
#define F_MID           uBands[0].w
#define F_HIMID         uBands[1].x
#define F_PRESENCE      uBands[1].y
#define F_BRILLIANCE    uBands[1].z
#define F_AIR           uBands[1].w

#define F_FLUX          uRhythm.x
#define F_ONSET         uRhythm.y
#define F_BEAT_PHASE    uRhythm.z
#define F_BAR_PHASE     uRhythm.w

#define F_BPM           uTempo.x
#define F_BPM_CONF      uTempo.y
#define F_BEAT_COUNT    uTempo.z
#define F_PERCUSSIVITY  uTempo.w

#define F_KEY_HUE       uTonal.x
#define F_KEY_CONF      uTonal.y
#define F_CHROMA_FLUX   uTonal.z
#define F_CENTROID      uTonal.w

#define F_STEREO_WIDTH  uSpace.x
#define F_STEREO_BAL    uSpace.y
#define F_NOVELTY       uSpace.z
#define F_SECTION_PHASE uSpace.w

#define F_INTENSITY     uCtl.x
#define F_ERA           uCtl.y
#define F_SONG_MODE     uCtl.z
#define F_PALETTE_MIX   uCtl.w

#define F_ASPECT        uRes.z
#define F_RENDER_SCALE  uRes.w

// Chroma is packed across three vec4s; index it through this.
float chroma(int pc) {
    int v = pc >> 2;
    int c = pc & 3;
    vec4 q = (v == 0) ? uChroma[0] : ((v == 1) ? uChroma[1] : uChroma[2]);
    return (c == 0) ? q.x : ((c == 1) ? q.y : ((c == 2) ? q.z : q.w));
}

// Beat-synced ramps. Prefer these over raw time for anything rhythmic —
// they degrade correctly when BPM confidence collapses (free-time passages),
// because the DSP drives F_BEAT_PHASE from onset decay in that case.
float beatPulse(float sharpness) {
    return pow(1.0 - F_BEAT_PHASE, sharpness);
}
float barPulse(float sharpness) {
    return pow(1.0 - F_BAR_PHASE, sharpness);
}

// Overall band energy, useful as a cheap global drive.
float bandSum() {
    return (uBands[0].x + uBands[0].y + uBands[0].z + uBands[0].w
          + uBands[1].x + uBands[1].y + uBands[1].z + uBands[1].w) * 0.125;
}
`;
// ===== END FILE =====

// ===== FILE: shaders/common/noise.glsl =====
const SH_NOISE = `
// Simplex, fBm, curl and hashes. Shared by every paint pass.
// Cost matters here: this file is the single largest GPU expense in the
// pipeline, so every consumer passes an explicit octave count.

vec3 rp_permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }

// 2D simplex, roughly -1..1.
float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                       -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod(i, 289.0);
    vec3 p = rp_permute(rp_permute(i.y + vec3(0.0, i1.y, 1.0))
                        + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
    m = m * m; m = m * m;
    vec3 x  = 2.0 * fract(p * C.www) - 1.0;
    vec3 h  = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
    vec3 g;
    g.x  = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

// Normalized fBm, -1..1. oct is clamped to 8 by the fixed loop bound so the
// compiler can still unroll.
float fbm(vec2 p, int oct, float lac, float gain) {
    float a = 0.5, s = 0.0, n = 0.0;
    for (int i = 0; i < 6; i++) {
        if (i >= oct) break;
        s += a * snoise(p);
        n += a;
        p *= lac;
        a *= gain;
    }
    return s / max(n, 1e-4);
}
float fbm2(vec2 p) { return fbm(p, 5, 2.02, 0.52); }

// Cheap curl for particle advection and warp jitter. Two octaves, 4 taps —
// this is called from a vertex shader at up to 64k invocations, so it is
// deliberately the coarsest thing in the file.
vec2 curl2lo(vec2 p) {
    const float e = 0.11;
    float n1 = snoise(p + vec2(0.0, e)) + 0.5 * snoise((p + vec2(0.0, e)) * 2.1);
    float n2 = snoise(p - vec2(0.0, e)) + 0.5 * snoise((p - vec2(0.0, e)) * 2.1);
    float n3 = snoise(p + vec2(e, 0.0)) + 0.5 * snoise((p + vec2(e, 0.0)) * 2.1);
    float n4 = snoise(p - vec2(e, 0.0)) + 0.5 * snoise((p - vec2(e, 0.0)) * 2.1);
    return vec2(n1 - n2, n4 - n3) / (3.0 * e);
}

float hash11(float p) {
    p = fract(p * 0.1031);
    p *= p + 33.33;
    p *= p + p;
    return fract(p);
}
float hash12(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}
vec2 hash22(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.xx + p3.yz) * p3.zy);
}
mat2 rot2(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }
`;
// ===== END FILE =====

// ===== FILE: shaders/common/palette.glsl =====
const SH_PALETTE = `
// Palette lookup. The preset's colour stops are baked into a 256x1 LUT on the
// host so the shader cost is one texture fetch. Requires common/features.glsl.

uniform sampler2D uPalette;
uniform float uPalRot;        // rotation of the LUT (keyHue routing lands here)
uniform float uChromaBlend;   // preset palette.chromaBlend
uniform float uSpiral;        // tie-dye spiral amount (plan 8.3)
uniform float uSpiralSpin;    // host-advanced phase, BPM/4

vec3 rp_hsv2rgb(vec3 c) {
    vec3 p = abs(fract(c.xxx + vec3(1.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0);
    return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}

vec3 palSample(float t) {
    return texture(uPalette, vec2(fract(t + uPalRot), 0.5)).rgb;
}

// Respond to the detected key by ROTATING the palette, not by blending toward
// a raw HSV hue. Tinting toward an arbitrary hue drags colours into the frame
// that the preset never declared — a blue-green wash over a magenta/amber
// scheme — and it is the fastest way to make a carefully chosen palette read
// as mud. Rotating stays inside the ramp, so a modulation reads as a shift
// *within* the colour scheme. Weighted by key confidence, so an unconfident
// read never yanks the scheme around.
vec3 palChroma(float t) {
    float w = clamp(uChromaBlend * (0.35 + 0.65 * F_KEY_CONF), 0.0, 1.0);
    return mix(palSample(t), palSample(t + F_KEY_HUE * 0.5), w);
}

// The tie-dye spiral is applied to the palette LOOKUP, never to geometry.
// Cheap, and it does more for period authenticity than any amount of mesh.
float palSpiralT(vec2 uv, float t) {
    vec2 c = uv - 0.5;
    c.x *= F_ASPECT;
    float r = length(c);
    float a = atan(c.y, c.x);
    return t + uSpiral * (a * 0.15915494 + r * 1.35 - uSpiralSpin);
}
`;
// ===== END FILE =====

// ===== FILE: shaders/common/sdf.glsl =====
const SH_SDF = `
// 2D SDF primitives + boolean ops for the motif layer.

float sdCircle(vec2 p, float r) { return length(p) - r; }

float sdSegment(vec2 p, vec2 a, vec2 b) {
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
    return length(pa - ba * h);
}

float sdBox(vec2 p, vec2 b) {
    vec2 d = abs(p) - b;
    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}

// Rose / petal lobe: an arc thickened by a cosine profile.
float sdPetal(vec2 p, float k, float len) {
    float a = atan(p.y, p.x);
    float r = length(p);
    return r - len * abs(cos(k * a * 0.5));
}

float opUnion(float a, float b) { return min(a, b); }
float opSub(float a, float b)   { return max(a, -b); }
float opSmoothUnion(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}
`;

// ===== FILE: shaders/common/safety.glsl =====
const SH_SAFETY = `
// Photosensitivity limiter — plan 12. Applied UNCONDITIONALLY in composite.frag.
//
// A preset may make this STRICTER but never looser: the host clamps the preset
// values against the ceilings below before upload, so there is no code path in
// which a preset relaxes the limiter. These two constants are the floor.

#define RIPPLE_SAFETY_MAX_DELTA_CEIL   0.12   // max mean-luminance step / frame
#define RIPPLE_SAFETY_MAX_BRIGHT_CEIL  0.92   // never full white

uniform float uSafetyScale;   // host-computed rate-limit gain, <= 1.0
uniform float uMaxBright;     // min(preset.safety.maxBrightness, CEIL)
uniform float uHueRate;       // |d(paletteRotate)/dt|, drives the R<->B guard

float rpLuma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

vec3 rippleSafety(vec3 col) {
    // 1. luminance rate cap — the gain is closed-loop on the host from the
    //    previous frame's measured mean luminance.
    col *= clamp(uSafetyScale, 0.0, 1.0);

    // 2. brightness ceiling.
    float mb = min(uMaxBright, RIPPLE_SAFETY_MAX_BRIGHT_CEIL);
    float l = rpLuma(col);
    if (l > mb) col *= mb / max(l, 1e-5);

    // 3. saturated red<->blue alternation is the highest-risk pattern. As the
    //    palette rotation rate climbs, bleed saturation out of the R/B axis so
    //    the interpolation path cannot swing between those poles at speed.
    float rb   = abs(col.r - col.b) / max(max(col.r, col.b), 1e-5);
    float risk = clamp(uHueRate * 7.0, 0.0, 1.0) * rb;
    col = mix(col, vec3(rpLuma(col)), risk * 0.55);

    return clamp(col, vec3(0.0), vec3(mb));
}
`;

// ===== FILE: shaders/passes/warp.frag =====
const SH_WARP = `
#include "common/features.glsl"
#include "common/noise.glsl"

// PASS A — feedback displacement. This is the MilkDrop core and the reason the
// whole pipeline is cheap: the image accumulates complexity over time instead
// of being recomputed. Decay is the highest-value parameter in the system.

uniform sampler2D uPrev;
uniform float uDecay;        // 0.94 .. 0.999
uniform float uZoom;
uniform float uRotate;
uniform float uWarpAmount;
uniform float uWarpScale;
uniform float uBassGain;
uniform float uSymmetry;     // 0 = off; > 0.5 folds into 2N sectors
uniform float uOnsetDecay;   // onset-driven decay dip
uniform float uCenterPull;

in vec2 vUv;
out vec4 fragColor;

void main() {
    vec2 c = vUv - 0.5;
    c.x *= F_ASPECT;

    // Kaleidoscopic fold. Routed from stereo width by default, which gives
    // free era differentiation: a 1969 two-track and the Wall of Sound image
    // very differently for zero extra cost.
    if (uSymmetry > 0.5) {
        float sectors = floor(2.0 + uSymmetry * 5.0) * 2.0;
        float seg = 6.28318531 / sectors;
        float a = atan(c.y, c.x);
        float r = length(c);
        a = abs(mod(a + seg * 0.5, seg) - seg * 0.5);
        c = vec2(cos(a), sin(a)) * r;
    }

    float t = F_TIME;
    float bass = F_BASS * uBassGain;

    float ang  = uRotate * (1.0 + 0.9 * F_STEREO_WIDTH) + uRotate * 0.5 * sin(t * 0.11);
    float zoom = uZoom + F_SUB * 0.011 * uBassGain + beatPulse(3.0) * 0.0018 * F_BPM_CONF;
    c = rot2(ang) * c / max(zoom, 0.5);

    // fBm domain warp of the *lookup*, not of the paint. Two fields plus a
    // curl term: the curl is what stops the flow reading as a scrolling texture.
    vec2 q = c * uWarpScale;
    vec2 d = vec2(fbm(q + vec2(0.0, t * 0.09), 3, 2.03, 0.55),
                  fbm(q + vec2(11.7, -3.1) - vec2(t * 0.07, 0.0), 3, 2.03, 0.55));
    d += 0.30 * curl2lo(q * 0.55 + vec2(t * 0.04, 0.0));
    c += d * (0.008 + uWarpAmount * 0.030) * (0.40 + 0.95 * bass);

    c -= c * uCenterPull * 0.005;

    c.x /= F_ASPECT;
    vec2 uv = c + 0.5;

    float decay = uDecay - uOnsetDecay * 0.05 * F_ONSET;

    vec3 prev = texture(uPrev, uv).rgb;

    // Edge falloff. Without it the warp drags the border colour inward and the
    // frame slowly fills with a single hue.
    vec2 e = smoothstep(vec2(0.0), vec2(0.04), uv)
           * smoothstep(vec2(0.0), vec2(0.04), 1.0 - uv);
    prev *= e.x * e.y;

    fragColor = vec4(prev * clamp(decay, 0.0, 0.9995), 1.0);
}
`;
// ===== END FILE =====

uniform sampler2D uSrc;
uniform float uThreshold;
uniform float uKnee;
in vec2 vUv;
out vec4 fragColor;
void main() {
    vec3 c = texture(uSrc, vUv).rgb;
    float l = max(max(c.r, c.g), c.b);
    float s = clamp((l - uThreshold) / max(uKnee, 1e-3), 0.0, 1.0);
    fragColor = vec4(c * s * s, 1.0);
}
`;

// Separable blur, 1-3 taps per side. Plan 8.1 explicitly wants a 2-tap
// down/up rather than a full pyramid — the bloom is an accent, not the look.
uniform sampler2D uSrc;
uniform vec2 uDir;
uniform float uTaps;
in vec2 vUv;
out vec4 fragColor;
void main() {
    vec3 s = texture(uSrc, vUv).rgb * 0.34;
    float w = 0.34;
    s += (texture(uSrc, vUv + uDir).rgb + texture(uSrc, vUv - uDir).rgb) * 0.24;
    w += 0.48;
    if (uTaps > 1.5) {
        s += (texture(uSrc, vUv + uDir * 2.6).rgb + texture(uSrc, vUv - uDir * 2.6).rgb) * 0.12;
        w += 0.24;
    }
    if (uTaps > 2.5) {
        s += (texture(uSrc, vUv + uDir * 5.1).rgb + texture(uSrc, vUv - uDir * 5.1).rgb) * 0.06;
        w += 0.12;
    }
    fragColor = vec4(s / w, 1.0);
}
`;

// ===== FILE: shaders/passes/composite.frag =====
const SH_COMPOSITE = `
#include "common/features.glsl"
#include "common/noise.glsl"
#include "common/safety.glsl"

// PASS C — tonemap, bloom, grain, vignette, safety clamp. Full resolution.

uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uExposure;
uniform float uBloomGain;
uniform float uGrain;
uniform float uVignette;
uniform float uSaturate;  // additive accumulation greys out; this pays it back
uniform float uIdle;      // 1 = live, 0.3 = idle dim (plan 11)

// Master intensity (plan 12), hotkey-adjustable, 0.05..1.0. Applied BEFORE
// rippleSafety so the limiter still sees and clamps the final picture: an
// intensity applied after the clamp would be a route around the ceiling, and
// this control sits INSIDE the safety envelope rather than beside it.
uniform float uIntensity;

in vec2 vUv;
out vec4 fragColor;

void main() {
    vec3 c = texture(uScene, vUv).rgb;
    c += texture(uBloom, vUv).rgb * uBloomGain;
    c *= uExposure * mix(0.30, 1.0, clamp(uIdle, 0.0, 1.0));

    // filmic curve — keeps the additive feedback buffer from clipping to white
    c = (c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14);

    // Many additive layers of different hues average toward grey, and the
    // filmic knee desaturates further. Pull it back after the curve, not
    // before, so the highlights keep their pigment.
    c = max(vec3(0.0), mix(vec3(dot(c, vec3(0.2126, 0.7152, 0.0722))), c, uSaturate));

    float g = hash12(vUv * vec2(1913.0, 1487.0) + fract(F_TIME * 3.7) * 137.0) - 0.5;
    c += g * uGrain * (0.35 + 0.75 * F_AIR);

    vec2 q = vUv - 0.5;
    q.x *= F_ASPECT;
    c *= 1.0 - uVignette * smoothstep(0.26, 0.88, length(q));

    c *= clamp(uIntensity, 0.0, 1.0);

    fragColor = vec4(rippleSafety(c), 1.0);
}
`;
// ===== END FILE =====

#include "common/features.glsl"
#include "common/noise.glsl"
#include "common/palette.glsl"

// Instanced-in-spirit but attribute-cheap: two floats per particle and the
// whole trajectory is evaluated in the vertex shader from curl noise, so the
// CPU does nothing per frame and there is no transform-feedback state.

in vec2 aSeed;
in float aIdx;

uniform float uCurlScale;
uniform float uLifetime;
uniform float uSize;
uniform float uEmit;
uniform float uRise;

out float vA;
out vec3 vC;

void main() {
    float life = max(uLifetime, 0.25);
    float age  = mod(F_TIME * (0.55 + 0.85 * F_PRESENCE) + aSeed.x * life, life);
    float k    = age / life;

    vec2 p0 = aSeed * 2.0 - 1.0;
    p0 += 0.30 * (hash22(vec2(aIdx, aIdx * 1.7)) - 0.5);

    // Advection: two curl samples at different scales, integrated as a
    // quadratic in age. Visually indistinguishable from stepwise integration
    // at this scale and a fraction of the cost.
    vec2 v1 = curl2lo(p0 * uCurlScale + vec2(0.0, F_TIME * 0.06));
    float sw = snoise(p0 * uCurlScale * 2.4 - vec2(F_TIME * 0.045, 0.0));
    vec2 v2 = vec2(-v1.y, v1.x) * sw;
    vec2 p  = p0 + v1 * age * 0.135 + v2 * age * age * 0.045;
    p.y += uRise * age * 0.20;

    float fade = smoothstep(0.0, 0.09, k) * (1.0 - k) * (1.0 - k);
    float burst = F_ONSET * step(hash11(aIdx * 0.37), 0.30);
    vA = fade * uEmit * (0.16 + 0.95 * F_PRESENCE + 1.5 * burst);

    float pt = fract(0.15 + 0.55 * hash11(aIdx * 2.9) + 0.30 * F_KEY_HUE);
    vC = palChroma(palSpiralT(p * 0.5 + 0.5, pt));

    gl_PointSize = max(1.0, uSize * (0.35 + 1.7 * (1.0 - k)) * F_RENDER_SCALE);
    p.x /= max(F_ASPECT, 0.2);
    gl_Position = vec4(p, 0.0, 1.0);
}
`;

<script>
/* ==========================================================================
   RIPPLE — fractal families and motifs. One program per family; deliberately
   NOT an uber-shader (plan 8.2 — register pressure from the union of all
   families would slow down the cheap ones).
   ========================================================================== */

// ===== FILE: shaders/fractal/warp_fbm.frag =====
const SH_WARP_FBM = `
#include "common/features.glsl"
#include "common/noise.glsl"
#include "common/palette.glsl"

// ---------------------------------------------------------------------------
//  HERO. Recursive domain-warped fBm, tuned to read as an oil-and-water
//  liquid light projection rather than as a noise demo.
//
//  What makes it read as liquid rather than as clouds — in order of how much
//  each one matters:
//
//   1. TWO immiscible fields, differenced. A single fBm is a cloud. The
//      difference of two independently warped fields has zero-crossings that
//      behave like a meniscus: they stretch, pinch and snap.
//   2. BANDING with thin bright rims. Real oil on a clock glass has flat
//      interior colour and a bright edge where light refracts through the
//      film boundary. Quantising the interference field into cells and
//      lighting only the cell walls is the whole trick.
//   3. THIN-FILM IRIDESCENCE on those rims, driven by the local gradient.
//      This is the specific thing that makes it look wet.
//   4. NEGATIVE SPACE. A low-frequency mask keeps roughly a third of the
//      frame dark. Without it the feedback buffer saturates and the trails —
//      which are doing most of the visual work — stop reading at all.
//   5. PER-CELL TINT. Each cell samples the palette at its own offset, so the
//      frame looks like several different pigments, not one gradient.
// ---------------------------------------------------------------------------

uniform float uWarp;      // domain-warp strength (the recursion gain)
uniform float uScale;     // base spatial frequency
uniform float uFlow;      // time rate
uniform float uCells;     // oil-cell density
uniform float uRim;       // rim highlight gain
uniform float uRimWidth;  // rim thickness in pixels (screen-space, not field-space)
uniform float uIrid;      // thin-film iridescence 0..1
uniform float uMask;      // negative-space bias
uniform float uOct;       // detail octaves (governor dial)
uniform float uPaint;     // paint gain, decay-normalized on the host

in vec2 vUv;
out vec4 fragColor;

// One recursion of Inigo Quilez's domain warp. The intermediate field is
// returned so the second layer can reuse it instead of paying for its own.
float liquid(vec2 p, float t, float amt, int oct, out vec2 mid) {
    vec2 q = vec2(fbm(p + vec2(0.0, 0.55 * t), 2, 2.05, 0.52),
                  fbm(p + vec2(5.2, 1.3) - vec2(0.42 * t, 0.0), 2, 2.05, 0.52));
    vec2 r = vec2(fbm(p + amt * q + vec2(1.7, 9.2) + vec2(0.28 * t, 0.0), 3, 2.05, 0.52),
                  fbm(p + amt * q + vec2(8.3, 2.8) - vec2(0.0, 0.21 * t), 3, 2.05, 0.52));
    mid = r;
    return fbm(p + amt * r, oct, 2.02, 0.52);
}

void main() {
    float t = F_TIME * uFlow;
    vec2 uv = vUv;
    vec2 p = uv - 0.5;
    p.x *= F_ASPECT;

    // Sub bass breathes the whole field in and out. Small number, large effect.
    p *= uScale * (1.0 - 0.12 * F_SUB);
    p = rot2(0.018 * t + 0.35 * F_STEREO_WIDTH) * p;

    int oct = int(clamp(uOct, 2.0, 6.0));
    float amt = uWarp * (0.65 + 1.15 * F_BASS);

    vec2 mid;
    float f = liquid(p, t, amt, oct, mid);
    // Second field: reuses the first field's warp vector, counter-rotating in
    // time. One extra fbm instead of five.
    float g = fbm(p * 0.63 + mid * amt * 0.75 + vec2(19.3, 4.7)
                  - vec2(t * 0.46, t * 0.13), oct, 2.02, 0.52);

    float iso = f * 1.25 - g * 0.85;

    // --- oil cells -------------------------------------------------------
    float dens = uCells * (1.0 + 0.30 * F_LOWMID);
    float n    = iso * dens + 0.14 * t + 0.22 * F_BAR_PHASE;
    float cell = floor(n);
    float fr   = fract(n);

    // The meniscus is the whole trick, and it has to be a CONSTANT number of
    // pixels wide or it reads as a soft gradient instead of a film boundary.
    // fwidth(n) is the field's rate of change per pixel, so dividing by it
    // converts a field-space distance into a screen-space one — thin bright
    // edges everywhere, including where the field is nearly flat.
    float aa    = max(fwidth(n), 1e-5);
    float dWall = min(fr, 1.0 - fr);
    float rimW  = min(uRimWidth * aa, 0.42);
    float rim   = 1.0 - smoothstep(0.0, rimW, dWall);
    float wall  = smoothstep(0.0, rimW * 3.2, dWall);

    // --- pigment + negative space ----------------------------------------
    // The pigment field is DELIBERATELY the lowest frequency thing here. A
    // high-frequency palette lookup averages to grey inside the feedback
    // trail; big single-hue blobs survive it, which is what makes the frame
    // look like several different oils rather than one gradient. The same
    // field carries the negative space, so a pigment always has an edge.
    float pig  = fbm(p * 0.24 + vec2(0.0, t * 0.085), 2, 2.1, 0.5);
    float mask = smoothstep(0.34, 0.66, pig * 0.5 + 0.5 + 0.09 * F_RMS - uMask);

    float grad = length(mid - vec2(g)) * 0.5;
    // A NARROW palette window, drifting slowly, is what keeps the image
    // chromatic. The feedback trail sums ~1/(1-decay) samples of the palette;
    // if that window is wide the sum averages to grey no matter how saturated
    // each sample was. Narrow window + slow drift = one coherent pigment per
    // region, and the trail stays the colour it started.
    float ct = 0.5 + 0.22 * pig + 0.11 * hash11(cell * 1.37) + 0.06 * F_CENTROID;
    vec3 body = palChroma(palSpiralT(uv, ct));
    // Thin-film shimmer, sampled from the PALETTE rather than from a raw hue
    // wheel — iridescence that cannot introduce an off-scheme colour.
    vec3 film = palChroma(palSpiralT(uv, ct + 0.09 + 0.30 * fract(grad * 1.7 + 0.30 * iso + 0.09 * t))) * 1.55;

    // The paint per frame is deliberately SPARSE and high contrast: a dim body
    // and a hot, thin meniscus. That matters more than it looks. The feedback
    // buffer reaches equilibrium at paint/(1-decay), so a paint layer that
    // covers the whole frame evenly accumulates to a flat wash no matter how it
    // is scaled. Paint only the moving edges and the trail becomes ribbons.
    vec3 col = body * (0.05 + 0.34 * wall) * (0.62 + 0.55 * f);
    // The meniscus is bright but must stay CHROMATIC — pushing a palette colour
    // past ~1.4 clips its largest channel and the highlight turns white, which
    // is how a colour scheme quietly becomes grey. Bloom supplies the heat.
    col += mix(palChroma(palSpiralT(uv, ct + 0.17)) * 1.45, film * 0.9, clamp(uIrid, 0.0, 1.0))
         * rim * uRim * (0.50 + 1.20 * F_HIMID + 0.60 * F_BRILLIANCE);

    col *= mask;
    col *= 0.45 + 0.95 * F_RMS + 0.55 * beatPulse(4.0) * F_BPM_CONF
         + 0.65 * F_ONSET * F_PERCUSSIVITY;

    fragColor = vec4(col * uPaint * F_INTENSITY, 1.0);
}
`;
// ===== END FILE =====

// ===== FILE: shaders/fractal/julia_orbit.frag =====
const SH_JULIA = `
#include "common/features.glsl"
#include "common/noise.glsl"
#include "common/palette.glsl"

// Julia set with c travelling a closed path. Path radius <- dynamics,
// position along the path <- beat phase. Morphing c on the beat is the
// classic mapping and still the best one.

uniform float uIter;
uniform float uEscape;
uniform float uOrbitR;
uniform float uBeatMorph;
uniform float uTrapGain;
uniform float uPaint;

in vec2 vUv;
out vec4 fragColor;

void main() {
    vec2 uv = vUv;
    vec2 z = (uv - 0.5) * 2.0;
    z.x *= F_ASPECT;
    z *= 1.38 - 0.26 * F_SUB;
    z = rot2(0.012 * F_TIME + 0.7 * F_STEREO_WIDTH) * z;

    float ph = 6.28318531 * (F_BEAT_PHASE * uBeatMorph + F_TIME * 0.014);

    // |c| is held near 0.79 — the boundary of the Mandelbrot set — because that
    // is where the Julia set is a connected filigree. An orbit that wanders
    // freely spends a good third of its time deep INSIDE the cardioid, where
    // the set is solid: every point stays bounded, escape time saturates, and
    // the frame goes black. Path radius still reads dynamics, position still
    // reads beat phase; the radius is just bounded to the interesting annulus.
    float R = clamp(0.58 + 0.75 * uOrbitR * (0.80 + 0.40 * F_DYNAMICS), 0.60, 0.88);
    vec2 c = R * vec2(cos(ph), sin(ph * 1.06));

    int N = int(clamp(uIter, 8.0, 160.0));
    float i = 0.0, trap = 0.0, minr = 1e9;
    for (int k = 0; k < 160; k++) {
        if (k >= N) break;
        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
        float r2 = dot(z, z);
        trap += exp(-3.4 * abs(sqrt(r2) - 0.88));   // orbit trap -> filigree
        minr = min(minr, r2);
        if (r2 > uEscape * uEscape) break;
        i += 1.0;
    }

    float sm    = i / float(N);
    float trapN = trap / float(N);              // iteration-count independent
    float inside = step(0.999, sm);

uniform float uEscape;

uniform float uZoomDepth;    // ln(max magnification)

#include "common/noise.glsl"
#include "common/sdf.glsl"

#include "common/noise.glsl"
#include "common/sdf.glsl"

// bolt is a genre motif, not a protected mark.

uniform float uForkDepth;
uniform float uImpulse;   // host-computed strike envelope 0..1
uniform float uSeed;      // re-rolled per strike so no two bolts repeat

  for (const src in map) {

    const f = FIELD_BY_KEY[src];
    if (!tgt || !f) continue;

<script>
/* ==========================================================================
   RIPPLE — feature sources.

   (a) SYNTH  synthetic feature driver: slider + LFO per Feature Frame field.
              THE primary mode. Decoupling look-tuning from audio work is the
              entire point of the harness.
   (b) MIC    live microphone.
   (c) FILE   uploaded audio file.
   (d) REPLAY a recorded feature timeline, for cross-host parity.

   Plan §7.1 (adaptive per-band normalization) and §7.2 (spectral-flux onsets)
   are implemented FAITHFULLY, because a divergence there would invalidate
   every preset tuned here. Tempo autocorrelation, 24-template key detection
   and HPSS percussivity are deliberately NOT implemented in Phase 0 — they
   are approximated and flagged with a ~ in the panel.
   ========================================================================== */

const LFO_SHAPES = ['sine', 'tri', 'saw', 'sqr', 'rnd'];

const SYN = {};   // key -> { v, lfo:{ on, rate, depth, shape, seed } }
FIELDS.forEach(f => {
  SYN[f.key] = { v: f.def, lfo: { on: false, rate: 0.12, depth: 0.35, shape: 'sine', seed: rngSynth() * 100 } };
});

/* A default LFO set, so the harness is already alive on load rather than a
   still frame that has to be poked into motion. */
function seedDefaultLfos() {
  const set = (k, rate, depth, shape) => {
    const s = SYN[k]; s.lfo.on = true; s.lfo.rate = rate; s.lfo.depth = depth; s.lfo.shape = shape || 'sine';
  };
  set('sub', 0.09, 0.55); set('bass', 0.23, 0.60); set('lowMid', 0.17, 0.42);
  set('mid', 0.13, 0.38); set('hiMid', 0.31, 0.40); set('presence', 0.41, 0.45, 'rnd');
  set('brilliance', 0.55, 0.40, 'rnd'); set('air', 0.07, 0.30);
  set('rms', 0.05, 0.30); set('dynamics', 0.11, 0.45);
  set('stereoWidth', 0.037, 0.60); set('centroid', 0.083, 0.40);
  set('keyHue', 0.008, 0.30, 'saw'); set('flux', 0.29, 0.5, 'rnd');
}
seedDefaultLfos();

const SYNTH = { autoRhythm: true, running: true, jamAmount: 1.0 };

function lfoValue(l, t) {
  const ph = t * l.rate + l.seed;
  switch (l.shape) {
    case 'tri': return 4 * Math.abs(((ph % 1) + 1) % 1 - 0.5) - 1;
    case 'saw': return 2 * (((ph % 1) + 1) % 1) - 1;
    case 'sqr': return (((ph % 1) + 1) % 1) < 0.5 ? -1 : 1;
    case 'rnd': {
      const i = Math.floor(ph), k = ph - i;
      const h = s => { const x = Math.sin(s * 127.1 + l.seed * 311.7) * 43758.5453; return 2 * (x - Math.floor(x)) - 1; };
      const s = k * k * (3 - 2 * k);
      return h(i) * (1 - s) + h(i + 1) * s;
    }
    default: return Math.sin(ph * 6.283185307);
  }
}

/* --- rhythm accumulator (§7.3, phase-locked; autocorrelation out of scope) - */
const RH = { phase: 0, bar: 0, beats: 0, lastOnset: -9, onsetEnv: 0, sectionPhase: 0 };

function advanceRhythm(dt, bpm, conf, onsetImpulse) {
  if (conf >= 0.35) {
    const inc = dt * bpm / 60;
    RH.phase += inc;
    // nudge toward the nearest boundary on an onset, gain 0.08 — a reset here
    // produces visible jitter, which is why this is an accumulator.
    if (onsetImpulse > 0.85) {
      const d = RH.phase - Math.round(RH.phase);
      if (Math.abs(d) < 0.25) RH.phase -= d * 0.08;
    }
    while (RH.phase >= 1) { RH.phase -= 1; RH.beats++; RH.bar = (RH.bar + 1) % 4; }
  } else {
    // Free-time fallback: drive beat phase from the decaying onset impulse.
    // This is what makes Drums -> Space work instead of insisting on a grid.
    RH.phase = 1 - onsetImpulse;
  }
  RH.sectionPhase = (RH.sectionPhase + dt / 45) % 1;
}

/* ========================================================================== */
/*  audio analysis                                                            */
/* ========================================================================== */

const A = {
  ctx: null, mode: 'synth', analyserL: null, analyserR: null, gainNode: null,
  srcNode: null, mediaEl: null, stream: null, fft: 2048, bins: 0, sr: 48000,
  freqL: null, freqR: null, timeL: null, timeR: null,
  mag: null, prevMag: null, band: null, env: null, hi: null, lo: null,
  fluxHist: null, fluxIdx: 0, chroma: null, chromaEma: null,
  bandEma: null, loudEma: 0, lastOnsetT: -9, onsetEnv: 0, status: 'idle', err: ''
};
const BAND_EDGES = [20, 60, 150, 400, 1000, 2400, 5000, 10000, 16000];

function initAudioGraph() {
  if (A.ctx) return A.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  A.ctx = new AC({ latencyHint: 'interactive' });
  A.sr = A.ctx.sampleRate;
  A.bins = A.fft / 2;
  const mk = () => {
    const an = A.ctx.createAnalyser();
    an.fftSize = A.fft;
    an.smoothingTimeConstant = 0;   // §7.1's envelopes are the ONLY smoothing
    an.minDecibels = -110; an.maxDecibels = 0;
    return an;
  };
  A.analyserL = mk(); A.analyserR = mk();
  A.split = A.ctx.createChannelSplitter(2);
  A.split.connect(A.analyserL, 0);
  A.split.connect(A.analyserR, 1);
  A.gainNode = A.ctx.createGain();
  A.gainNode.gain.value = 1;
  A.gainNode.connect(A.split);

  A.freqL = new Float32Array(A.bins); A.freqR = new Float32Array(A.bins);
  A.timeL = new Float32Array(A.fft); A.timeR = new Float32Array(A.fft);
  A.mag = new Float32Array(A.bins); A.prevMag = new Float32Array(A.bins);
  A.band = new Float32Array(8);
  A.env = new Float32Array(8).fill(-90);
  A.hi = new Float32Array(8).fill(-40);
  A.lo = new Float32Array(8).fill(-90);
  A.fluxHist = new Float32Array(43);
  A.chroma = new Float32Array(12);
  A.chromaEma = new Float32Array(12);
  A.bandEma = new Float32Array(8);
  return A.ctx;
}

function median43(arr) {
  const t = Array.prototype.slice.call(arr);
  t.sort((a, b) => a - b);
  return t[21];
}

function analyzeAudio(dt, tNow) {
  const an = A.analyserL;
  if (!an) return;
  an.getFloatFrequencyData(A.freqL);
  A.analyserR.getFloatFrequencyData(A.freqR);
  an.getFloatTimeDomainData(A.timeL);
  A.analyserR.getFloatTimeDomainData(A.timeR);

  const binHz = A.sr / A.fft;   // derived from the ACTUAL sample rate

  // dB -> linear magnitude, summed L+R
  let magSum = 0, wSum = 0, cSum = 0;
  for (let k = 0; k < A.bins; k++) {
    const m = (Math.pow(10, A.freqL[k] / 20) + Math.pow(10, A.freqR[k] / 20)) * 0.5;
    A.mag[k] = m;
    magSum += m;
    const f = k * binHz;
    wSum += m * f; cSum += m;
  }

  /* ---- §7.1 eight perceptual bands with adaptive normalization ---------- */
  const atk = 1 - Math.exp(-dt / 0.010);
  const rel = 1 - Math.exp(-dt / 0.250);
  const kHi = 1 - Math.exp(-dt / 3.0);
  const kLo = 1 - Math.exp(-dt / 8.0);
  for (let b = 0; b < 8; b++) {
    const k0 = Math.max(1, Math.floor(BAND_EDGES[b] / binHz));
    const k1 = Math.min(A.bins - 1, Math.ceil(BAND_EDGES[b + 1] / binHz));
    let E = 0, n = 0;
    for (let k = k0; k <= k1; k++) { E += A.mag[k] * A.mag[k]; n++; }
    E /= Math.max(n, 1);
    const dB = 10 * Math.log10(E + 1e-12);
    A.env[b] = A.env[b] + (dB - A.env[b]) * (dB > A.env[b] ? atk : rel);
    A.hi[b] = dB > A.hi[b] ? dB : A.hi[b] + (dB - A.hi[b]) * kHi;
    A.lo[b] = dB < A.lo[b] ? dB : A.lo[b] + (dB - A.lo[b]) * kLo;
    A.band[b] = Math.min(1, Math.max(0, (A.env[b] - A.lo[b]) / Math.max(A.hi[b] - A.lo[b], 6.0)));
  }

  /* ---- §7.2 spectral flux + adaptive peak-pick ------------------------- */
  const kFluxLo = Math.max(1, Math.floor(40 / binHz));
  const kFluxHi = Math.min(A.bins - 1, Math.ceil(8000 / binHz));
  let flux = 0, den = 1e-9, fHi = 0, fLo = 0;
  for (let k = kFluxLo; k <= kFluxHi; k++) {
    const d = A.mag[k] - A.prevMag[k];
    if (d > 0) { flux += d; if (k * binHz > 2000) fHi += d; else fLo += d; }
    den += A.mag[k];
  }
  flux /= den;
  A.prevMag.set(A.mag);

  A.fluxHist[A.fluxIdx] = flux;
  A.fluxIdx = (A.fluxIdx + 1) % 43;
  const thr = median43(A.fluxHist) * 1.4 + 0.02;
  let impulse = A.onsetEnv * Math.exp(-dt / 0.150);
  if (flux > thr && tNow - A.lastOnsetT > 0.050) { impulse = 1; A.lastOnsetT = tNow; }
  A.onsetEnv = impulse;

  /* ---- §7.5 stereo width via mid/side ---------------------------------- */
  let mAcc = 0, sAcc = 0, pk = 0;
  for (let i = 0; i < A.fft; i++) {
    const L = A.timeL[i], R = A.timeR[i];
    const M = (L + R) * 0.5, S = (L - R) * 0.5;
    mAcc += M * M; sAcc += S * S;
    const a = Math.abs(M); if (a > pk) pk = a;
  }
  const rmsM = Math.sqrt(mAcc / A.fft), rmsS = Math.sqrt(sAcc / A.fft);
  const width = rmsS / (rmsM + rmsS + 1e-9);
  const bal = Math.max(-1, Math.min(1, (Math.sqrt(mAcc) - Math.sqrt(sAcc)) * 0 +
    (function () { let l = 0, r = 0; for (let i = 0; i < A.fft; i++) { l += A.timeL[i] * A.timeL[i]; r += A.timeR[i] * A.timeR[i]; } return (Math.sqrt(r) - Math.sqrt(l)) / (Math.sqrt(r) + Math.sqrt(l) + 1e-9); })()));

  const rms = Math.min(1, rmsM * 3.2);
  const peak = Math.min(1, pk * 1.6);
  A.loudEma += (rms - A.loudEma) * (1 - Math.exp(-dt / 3.0));

  /* ---- APPROX: chroma / key. §7.4's 24-template correlation is Phase 2. -- */
  A.chroma.fill(0);
  const kC0 = Math.max(1, Math.floor(55 / binHz));
  const kC1 = Math.min(A.bins - 1, Math.ceil(5000 / binHz));
  for (let k = kC0; k <= kC1; k++) {
    const f = k * binHz;
    const pc = ((Math.round(12 * Math.log2(f / 440)) % 12) + 12) % 12;
    A.chroma[pc] += A.mag[k] / (1 + f / 1400);      // log-frequency taper
  }
  let cMax = 1e-9;
  for (let i = 0; i < 12; i++) cMax = Math.max(cMax, A.chroma[i]);
  let best = 0, second = 0, bestI = 0;
  for (let i = 0; i < 12; i++) {
    A.chroma[i] /= cMax;
    if (A.chroma[i] > best) { second = best; best = A.chroma[i]; bestI = i; }
    else if (A.chroma[i] > second) second = A.chroma[i];
  }
  const keyHue = ((bestI * 7) % 12) / 12;           // circle of fifths (§7.4)
  const keyConf = Math.min(1, Math.max(0, (best - second) * 2.2));
  let cflux = 0;
  const kEma = 1 - Math.exp(-dt / 0.5);
  for (let i = 0; i < 12; i++) {
    cflux += Math.abs(A.chroma[i] - A.chromaEma[i]);
    A.chromaEma[i] += (A.chroma[i] - A.chromaEma[i]) * kEma;
  }
  cflux = Math.min(1, cflux / 4.0);

  /* ---- novelty: cosine distance of the band vector vs its 8 s EMA ------- */
  let dot = 0, na = 0, nb = 0;
  const kN = 1 - Math.exp(-dt / 8.0);
  for (let b = 0; b < 8; b++) {
    dot += A.band[b] * A.bandEma[b];
    na += A.band[b] * A.band[b]; nb += A.bandEma[b] * A.bandEma[b];
    A.bandEma[b] += (A.band[b] - A.bandEma[b]) * kN;
  }
  const novelty = Math.min(1, Math.max(0, 1 - dot / (Math.sqrt(na * nb) + 1e-9)) * 2.4);

  /* ---- APPROX: percussivity. HPSS median filtering is Phase 2. ---------- */
  const perc = Math.min(1, (fHi / (fHi + fLo + 1e-9)) * 1.35);

  const centroidHz = wSum / (cSum + 1e-9);
  const centroid = Math.min(1, Math.max(0, Math.log2(Math.max(centroidHz, 55) / 55) / Math.log2(16000 / 55)));

  return {
    band: A.band, rms, peak, loud: A.loudEma, dyn: Math.max(0, peak - rms),
    flux: Math.min(1, flux * 6), onset: impulse, width, bal,
    chroma: A.chroma, keyHue, keyConf, cflux, novelty, perc, centroid
  };
}

/* --- source switching ---------------------------------------------------- */

function stopSource() {
  if (A.stream) { A.stream.getTracks().forEach(t => t.stop()); A.stream = null; }
  if (A.srcNode) { try { A.srcNode.disconnect(); } catch (e) {} A.srcNode = null; }
  if (A.mediaEl) { A.mediaEl.pause(); A.mediaEl = null; }
}

async function useMic() {
  initAudioGraph();
  stopSource();
  try {
    await A.ctx.resume();
    A.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    A.srcNode = A.ctx.createMediaStreamSource(A.stream);
    A.srcNode.connect(A.gainNode);
    A.mode = 'mic'; A.status = 'mic live'; A.err = '';
  } catch (e) {
    A.mode = 'synth'; A.status = 'mic denied'; A.err = String(e.message || e);
  }
  syncSourceUi();
}

async function useFile(file) {
  initAudioGraph();
  stopSource();
  await A.ctx.resume();
  const el = new Audio();
  el.src = URL.createObjectURL(file);
  el.loop = true; el.crossOrigin = 'anonymous';
  A.mediaEl = el;
  A.srcNode = A.ctx.createMediaElementSource(el);
  A.srcNode.connect(A.gainNode);
  A.gainNode.connect(A.ctx.destination);   // monitor file playback
  try { await el.play(); } catch (e) { A.err = String(e.message || e); }
  A.mode = 'file'; A.status = file.name.slice(0, 34);
  syncSourceUi();
}

function useSynth() { stopSource(); A.mode = 'synth'; A.status = 'synthetic driver'; syncSourceUi(); }

/* ========================================================================== */
/*  feature timeline recorder / player — makes Phase 1's parity gate real     */
/* ========================================================================== */

const TL = {
  rec: false, frames: [], rate: 60, seconds: 20, t0: 0, acc: 0,
  play: false, data: null, pt: 0, name: '',
  // --- exact frame-stepping mode (the parity gate) ---
  // step:      one timeline row per rendered frame, no interpolation
  // stepFrame: index of the NEXT row to render
  // cur:       index of the row the current frame was built from
  step: false, stepFrame: 0, cur: -1, ended: false
};

function tlStart(seconds, rate) {
  TL.seconds = seconds; TL.rate = rate;
  TL.frames = []; TL.acc = 0; TL.rec = true; TL.t0 = performance.now() / 1000;
}
function tlStop() { TL.rec = false; }
function tlCapture(dt) {
  if (!TL.rec) return;
  TL.acc += dt;
  const step = 1 / TL.rate;
  if (TL.acc + 1e-6 < step) return;
  TL.acc -= step;
  const row = new Array(FEATURE_FLOATS);
  for (let i = 0; i < FEATURE_FLOATS; i++) row[i] = Math.round(F[i] * 1e5) / 1e5;
  TL.frames.push(row);
  if (TL.frames.length >= Math.round(TL.seconds * TL.rate)) TL.rec = false;
}
function tlExport() {
  return {
    schemaVersion: 1,
    kind: 'ripple-feature-timeline',
    generator: 'ripple-harness/0.1',
    recorded: new Date().toISOString(),
    rate: TL.rate,
    seconds: +(TL.frames.length / TL.rate).toFixed(3),
    frameBytes: FEATURE_BYTES,
    note: 'frames[i] is the 56-float std140 FeatureFrame in declaration order. '
        + 'Replay one row per frame, upload verbatim, and both hosts see an '
        + 'identical timeline (plan §15 phase 1 gate). Replay in STEP mode, not '
        + 'the interpolated player: dt is exactly 1/rate and time is i/rate. '
        + 'Indices 0,1,48,49,50,51 (uTime.xy, uRes) are owned by the host and '
        + 'are overwritten on replay; every other field is uploaded verbatim.',
    fieldOrder: FIELD_ORDER,
    frames: TL.frames
  };
}
function tlLoad(json) {
  if (!json || json.kind !== 'ripple-feature-timeline' || !Array.isArray(json.frames))
    throw new Error('not a ripple feature timeline');
  if (json.frames.length && json.frames[0].length !== FEATURE_FLOATS)
    throw new Error('frame width ' + json.frames[0].length + ', expected ' + FEATURE_FLOATS);
  TL.data = json; TL.pt = 0; TL.play = true;
}
/* Two modes, and the difference is the whole point of this file.

   STEP (TL.step) - timeline frame i maps to render frame i. One row per frame,
   copied verbatim: no interpolation, no wraparound. Playback holds on the last
   row rather than looping back into frame 0 against a full feedback buffer.
   This is the mode tlExport()'s own note specifies, and the only one a
   cross-host frame diff can use, because it takes wall-clock time out of the
   result entirely.

   INTERPOLATED (default) - advances by dt * rate and lerps between rows. Right
   for eyeballing a timeline at whatever rate the display happens to run at,
   wrong for a diff: any frame-rate difference between the hosts changes every
   sampled value. */
function tlTick(dt) {
  if (!TL.play || !TL.data) return false;
  const n = TL.data.frames.length;
  if (!n) return false;

  if (TL.step) {
    const i = Math.min(TL.stepFrame, n - 1);
    TL.cur = i;
    TL.ended = TL.stepFrame >= n - 1;
    const a = TL.data.frames[i];
    for (let k = 0; k < FEATURE_FLOATS; k++) F[k] = a[k];
    TL.stepFrame = Math.min(TL.stepFrame + 1, n);
    return true;
  }

  TL.pt += dt * TL.data.rate;
  if (TL.pt >= n) TL.pt -= n;
  const i0 = Math.floor(TL.pt) % n, i1 = (i0 + 1) % n, k = TL.pt - Math.floor(TL.pt);
  const a = TL.data.frames[i0], b = TL.data.frames[i1];
  for (let i = 0; i < FEATURE_FLOATS; i++) F[i] = a[i] + (b[i] - a[i]) * k;
  TL.cur = i0;
  return true;
}

function download(name, obj) {
  const blob = new Blob([typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2)],
    { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
</script>
